<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>2D対戦シューティング</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      background: #222;
      color: white;
    }
    .hidden { display: none; }
    canvas { background: #fff; display: block; margin: 0 auto; }

    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }

    select {
      margin: 5px;
      padding: 5px;
      font-size: 16px;
    }

    /* ===== ここから ver14 追加スタイル ===== */
    :root {
      --bg: #070b16;
      --panel: rgba(16, 24, 46, .82);
      --line: rgba(0, 229, 255, .35);
      --cyan: #00e5ff;
      --pink: #ff2e88;
      --text: #e8f1ff;
    }
    body {
      background: radial-gradient(ellipse at 20% 0%, #14224a 0%, var(--bg) 55%) fixed;
      min-height: 100vh;
      color: var(--text);
    }
    #menuBg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; background: transparent; margin: 0; }

    button {
      color: #fff;
      background: linear-gradient(135deg, #1b2c52, #121c36);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      transition: transform .12s, box-shadow .2s, border-color .2s;
    }
    button:hover:not(:disabled) { border-color: var(--cyan); box-shadow: 0 0 16px rgba(0,229,255,.4); transform: translateY(-1px); }
    button:disabled { opacity: .4; cursor: not-allowed; }
    select, input[type=text] {
      background: #0e1730; color: #fff; border: 1px solid var(--line); border-radius: 6px;
    }
    input[type=text] { padding: 8px 10px; font-size: 18px; }
    h2 { letter-spacing: .08em; }

    /* --- ホーム --- */
    .home-wrap { padding: 7vh 16px 40px; max-width: 560px; margin: 0 auto; }
    .logo-sub { color: var(--cyan); letter-spacing: .55em; font-size: 13px; font-weight: bold; text-shadow: 0 0 10px var(--cyan); }
    .logo {
      margin: 10px 0 36px; font-size: clamp(34px, 8vw, 58px); font-style: italic; line-height: 1.15;
      transform: skewX(-6deg); letter-spacing: .04em;
      text-shadow: 0 0 18px rgba(0,229,255,.55), 3px 3px 0 var(--pink);
    }
    .logo span { display: block; font-size: .62em; color: var(--cyan); text-shadow: 0 0 18px rgba(0,229,255,.8), 2px 2px 0 #000; }
    .menu-list { display: flex; flex-direction: column; gap: 14px; }
    .menu-btn {
      display: flex; align-items: center; gap: 16px; width: 100%; margin: 0; padding: 16px 22px; text-align: left;
      background: linear-gradient(100deg, rgba(20,34,70,.95), rgba(10,16,34,.9));
      border-left: 5px solid var(--cyan); clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
      position: relative; overflow: hidden;
    }
    .menu-btn::after {
      content: ""; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.18), transparent); transform: skewX(-20deg); transition: left .5s;
    }
    .menu-btn:hover:not(:disabled)::after { left: 130%; }
    .menu-btn:hover:not(:disabled) { transform: translateX(8px); }
    .menu-btn.online { border-left-color: var(--pink); }
    .menu-btn.cpu { border-left-color: #6dff8a; }
    body.cpu #touchUI .tp2 { display: none; }
    body.cpu #touchUI .tp1 .tbtns { left: auto; right: max(18px, env(safe-area-inset-right)); flex-direction: row-reverse; }
    .menu-btn.codex { border-left-color: #ffd23f; }
    .menu-btn .mb-icon { font-size: 30px; width: 40px; text-align: center; }
    .menu-btn b { display: block; font-size: 21px; letter-spacing: .1em; }
    .menu-btn small { color: #9db4d8; font-size: 12px; }
    .ver { margin-top: 30px; color: #5c6f93; font-size: 12px; letter-spacing: .2em; }

    /* --- 共通パネル --- */
    .panel-screen { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px 18px; margin: 14px auto; backdrop-filter: blur(4px);
    }
    .card h3 { margin: 0 0 6px; color: var(--cyan); }
    .card p { margin: 4px 0 10px; color: #9db4d8; font-size: 14px; }
    .status { min-height: 1.4em; margin-top: 10px; font-size: 14px; color: #ffd23f; }
    .status.err { color: #ff6b7a; }
    #roomCodeInput { width: 110px; text-align: center; text-transform: uppercase; letter-spacing: .3em; }

    /* --- ロビー --- */
    .room-code { font-size: 40px; letter-spacing: .35em; font-weight: bold; color: var(--cyan); text-shadow: 0 0 14px var(--cyan); margin: 4px 0; }
    .vs-row { display: flex; align-items: stretch; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .slot { flex: 1; min-width: 200px; max-width: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .slot.p1 { border-top: 4px solid #3b82f6; }
    .slot.p2 { border-top: 4px solid #ef4444; }
    .slot .who { font-size: 12px; letter-spacing: .2em; color: #9db4d8; }
    .slot img { width: 130px; height: 130px; object-fit: contain; margin: 8px 0; }
    .slot .nm { font-weight: bold; min-height: 1.4em; }
    .vs-mark { align-self: center; font-size: 28px; font-weight: bold; font-style: italic; color: var(--pink); text-shadow: 0 0 12px var(--pink); }
    .keyhelp { font-size: 13px; color: #9db4d8; line-height: 1.8; }
    kbd { background: #1b2c52; border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; color: #fff; font-family: inherit; }

    /* --- 図鑑 --- */
    .codex-wrap { max-width: 980px; margin: 0 auto; padding: 20px 14px 40px; }
    .codex-main { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; text-align: left; }
    .codex-grid { flex: 0 0 300px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .cx-item { margin: 0; padding: 6px 4px; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .cx-item img, .cx-ph { width: 62px; height: 62px; object-fit: contain; }
    .cx-ph { display: flex; align-items: center; justify-content: center; font-size: 28px; background: #0e1730; border-radius: 8px; }
    .cx-item.active { border-color: var(--pink); box-shadow: 0 0 14px rgba(255,46,136,.55); }
    .codex-detail { flex: 1; min-width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
    .cd-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .cd-head img, .cd-head .cx-ph { width: 150px; height: 150px; object-fit: contain; font-size: 60px; }
    .cd-name { font-size: 26px; font-weight: bold; }
    .cd-title { color: var(--cyan); font-size: 14px; margin-top: 2px; }
    .stat { display: grid; grid-template-columns: 90px 1fr 70px; gap: 8px; align-items: center; margin: 7px 0; font-size: 13px; }
    .stat .bar { height: 10px; border-radius: 6px; background: #0e1730; overflow: hidden; }
    .stat .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--pink)); }
    .stat .val { text-align: right; color: #cfe3ff; }
    .cd-sec { margin-top: 14px; }
    .cd-sec h4 { margin: 0 0 4px; color: #ffd23f; font-size: 14px; letter-spacing: .1em; }
    .cd-sec p { margin: 0; font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
    .note { font-size: 11px; color: #6f83a8; margin-top: 12px; }

    /* --- 共通 戻るボタン --- */
    #backBtn { position: fixed; top: 8px; left: 8px; margin: 0; padding: 6px 12px; font-size: 13px; z-index: 50; }
    #onlineResult h2 { font-size: 34px; text-shadow: 0 0 16px var(--cyan); }
  
    /* ===== ver16 ビジュアル刷新 ===== */
    body { font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif; }
    .cta {
      margin: 14px 8px; padding: 14px 40px; font-size: 18px; font-weight: 800; letter-spacing: .12em;
      background: linear-gradient(100deg, #ff2e88, #ff6a3d); border: none; color: #fff; border-radius: 0;
      clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
      transition: filter .15s, transform .15s;
    }
    .cta:hover:not(:disabled) { filter: brightness(1.18); transform: translateY(-2px); box-shadow: none; }
    .cta.ghost { background: linear-gradient(100deg, #2a3d66, #17223f); }

    .select-screen { max-width: 1100px; margin: 0 auto; padding: 56px 16px 28px; }
    .sel-head { display: flex; align-items: baseline; gap: 14px; text-align: left; border-bottom: 1px solid var(--line); margin-bottom: 18px; padding-bottom: 8px; flex-wrap: wrap; }
    .sel-head small { color: var(--cyan); letter-spacing: .4em; font-weight: 800; font-size: 12px; }
    .sel-head h2 { margin: 0; font-size: 28px; font-style: italic; letter-spacing: .12em; }
    .sel-head .vs-sum { margin-left: auto; font-weight: 800; letter-spacing: .08em; color: #cfe3ff; }

    .cs-layout { display: grid; grid-template-columns: 250px 1fr 250px; gap: 16px; align-items: start; }
    .cs-side { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: left; }
    .cs-side.p1 { border-top: 4px solid #3aa0ff; background-image: linear-gradient(160deg, rgba(58,160,255,.2), transparent 55%); }
    .cs-side.p2 { border-top: 4px solid #ff4d6d; background-image: linear-gradient(200deg, rgba(255,77,109,.2), transparent 55%); }
    .cs-side .who { font-size: 12px; letter-spacing: .3em; font-weight: 800; }
    .cs-side.p1 .who { color: #7cc2ff; } .cs-side.p2 .who { color: #ff8aa0; }
    .cs-portrait { height: 190px; display: flex; align-items: center; justify-content: center; margin: 6px 0 8px; }
    .cs-portrait img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 8px 16px rgba(0,0,0,.6)); }
    .cs-portrait .cx-ph { width: 120px; height: 120px; font-size: 50px; }
    .cs-name { font-size: 22px; font-weight: 800; }
    .cs-tag { color: #9db4d8; font-size: 12px; min-height: 2.6em; margin: 2px 0 8px; }
    .cs-side .stat { grid-template-columns: 52px 1fr 56px; font-size: 11px; margin: 5px 0; }
    .cs-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .cs-tab { margin: 0; padding: 7px 24px; font-weight: 800; letter-spacing: .15em; font-size: 13px; }
    .cs-tab.on1 { background: #1d5fa8; border-color: #3aa0ff; box-shadow: 0 0 14px rgba(58,160,255,.5); }
    .cs-tab.on2 { background: #a8243f; border-color: #ff4d6d; box-shadow: 0 0 14px rgba(255,77,109,.5); }
    .cs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .cs-card { position: relative; margin: 0; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; }
    .cs-card img, .cs-card .cx-ph { width: 70px; height: 70px; object-fit: contain; }
    .cs-card.sel1 { border-color: #3aa0ff; box-shadow: 0 0 14px rgba(58,160,255,.55); }
    .cs-card.sel2 { border-color: #ff4d6d; box-shadow: 0 0 14px rgba(255,77,109,.55); }
    .cs-badges { position: absolute; top: 3px; left: 3px; display: flex; gap: 3px; }
    .cs-badges i { font-style: normal; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 3px; }
    .cs-badges .b1 { background: #3aa0ff; color: #04203d; } .cs-badges .b2 { background: #ff4d6d; color: #2c0510; }
    .sel-foot { margin-top: 18px; }

    .ms-layout { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .ms-list { flex: 0 0 340px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ms-card { margin: 0; padding: 6px; text-align: left; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
    .ms-card canvas { width: 100%; height: auto; border-radius: 6px; background: #000; margin: 0; }
    .ms-card b { font-size: 14px; } .ms-card small { color: #9db4d8; font-size: 11px; }
    .ms-card.on { border-color: var(--pink); box-shadow: 0 0 16px rgba(255,46,136,.5); }
    .ms-detail { flex: 1; min-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: left; }
    .ms-detail canvas { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); background: #000; margin: 0; }
    .ms-detail h3 { margin: 12px 0 2px; font-size: 26px; font-style: italic; letter-spacing: .06em; }
    .ms-detail .tagline { color: var(--cyan); font-size: 13px; letter-spacing: .2em; font-weight: 800; }
    .ms-detail p { color: #cfe3ff; line-height: 1.7; font-size: 14px; margin: 8px 0 0; }
    .lobby-prev { display: block; margin: 8px auto; width: 320px; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #000; }

    #gameScreen { padding: 46px 10px 18px; }
    .battle-wrap { max-width: 880px; margin: 0 auto; }
    .hud { display: grid; grid-template-columns: 1fr 150px 1fr; gap: 10px; align-items: stretch; margin-bottom: 10px; }
    .hud-p { display: flex; gap: 10px; align-items: center; padding: 8px 14px; background: var(--panel); border: 1px solid var(--line); text-align: left; }
    .hud-p.p1 { border-left: 4px solid #3aa0ff; clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); }
    .hud-p.p2 { border-right: 4px solid #ff4d6d; flex-direction: row-reverse; text-align: right; clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%); }
    .hud-portrait { width: 58px; height: 58px; flex: 0 0 58px; border-radius: 50%; overflow: hidden; background: #0b1226; border: 2px solid; display: flex; align-items: center; justify-content: center; font-weight: 800; }
    .hud-p.p1 .hud-portrait { border-color: #3aa0ff; } .hud-p.p2 .hud-portrait { border-color: #ff4d6d; }
    .hud-portrait img { width: 100%; height: 100%; object-fit: cover; }
    .hud-body { flex: 1; min-width: 0; }
    .hud-name { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hud-name .tag { font-size: 11px; padding: 1px 6px; margin-right: 6px; border-radius: 3px; color: #04122a; font-weight: 800; }
    .hud-p.p1 .tag { background: #3aa0ff; } .hud-p.p2 .tag { background: #ff4d6d; margin-right: 0; margin-left: 6px; order: 2; }
    .hp { position: relative; height: 14px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.18); transform: skewX(-14deg); margin: 4px 0; overflow: hidden; }
    .hp .trail, .hp .fill { position: absolute; top: 0; bottom: 0; left: 0; }
    .hud-p.p2 .hp .trail, .hud-p.p2 .hp .fill { left: auto; right: 0; }
    .hp .trail { background: #fff; opacity: .75; transition: width .7s ease .25s; }
    .hp .fill { background: linear-gradient(90deg, #27d6a0, #4dff9b); transition: width .12s; }
    .hp.mid .fill { background: linear-gradient(90deg, #ff9f1a, #ffc53d); }
    .hp.low .fill { background: linear-gradient(90deg, #ff2e4d, #ff6b7a); animation: pulseB .6s infinite alternate; }
    .hp em { position: absolute; inset: 0; text-align: center; font-style: normal; font-size: 11px; font-weight: 800; line-height: 14px; text-shadow: 0 0 3px #000; transform: skewX(14deg); }
    .hud-row { display: flex; align-items: center; gap: 8px; }
    .hud-p.p2 .hud-row { flex-direction: row-reverse; }
    .pips { display: flex; gap: 2px; min-width: 20px; }
    .pips i { display: block; width: 8px; height: 12px; background: rgba(255,255,255,.12); transform: skewX(-14deg); }
    .pips i.on { background: #7df3ff; box-shadow: 0 0 6px #00e5ff; }
    .pips.inf { color: #7df3ff; font-weight: 800; font-size: 13px; }
    .skill { position: relative; flex: 1; height: 12px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.18); transform: skewX(-14deg); overflow: hidden; }
    .skill i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: linear-gradient(90deg, #b8860b, #ffd23f); }
    .hud-p.p2 .skill i { left: auto; right: 0; }
    .skill b { position: absolute; inset: 0; text-align: center; font-size: 9px; font-weight: 800; line-height: 12px; letter-spacing: .1em; text-shadow: 0 0 3px #000; transform: skewX(14deg); }
    .skill.ready { border-color: #ffd23f; box-shadow: 0 0 10px rgba(255,210,63,.7); animation: pulseB .8s infinite alternate; }
    .hud-center { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; }
    .timer { font-size: 30px; font-weight: 900; font-style: italic; letter-spacing: .08em; text-shadow: 0 0 12px rgba(0,229,255,.7); }
    .zone { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: #9db4d8; }
    .zone.hot { color: #ff6b7a; animation: pulseB .6s infinite alternate; }
    .mapname { font-size: 11px; color: var(--cyan); letter-spacing: .2em; margin: 0; }
    .arena { padding: 6px; background: linear-gradient(135deg, rgba(0,229,255,.6), rgba(255,46,136,.6)); clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
    .arena canvas { width: 100%; height: auto; background: #000; display: block; margin: 0; }
    .ctrl { margin-top: 10px; font-size: 12px; color: #9db4d8; letter-spacing: .06em; }
    @keyframes pulseB { from { filter: brightness(1); } to { filter: brightness(1.5); } }

    .result-wrap { padding-top: 14vh; }
    .res-label { color: var(--cyan); letter-spacing: .6em; font-size: 13px; font-weight: 800; }
    #resultText, #onlineResult #onlineResultText { font-size: clamp(36px, 8vw, 64px); font-style: italic; margin: 10px 0 26px; letter-spacing: .06em; text-shadow: 0 0 24px rgba(0,229,255,.7), 3px 3px 0 var(--pink); }

    @media (max-width: 860px) {
      .cs-layout { grid-template-columns: 1fr; }
      .cs-grid { grid-template-columns: repeat(3, 1fr); }
      .hud { grid-template-columns: 1fr; }
      .hud-center { order: -1; flex-direction: row; gap: 12px; }
    }
  
    /* ===== ver17 モバイル対応（body.mobile のときだけ有効。PC表示は変わりません） ===== */
    .mode-sel { margin-top: 22px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
    .mode-sel span { color: #9db4d8; font-size: 12px; letter-spacing: .2em; }
    .mode-sel button { margin: 0; padding: 8px 16px; font-size: 14px; }
    .mode-sel button.on { border-color: var(--cyan); box-shadow: 0 0 14px rgba(0,229,255,.5); background: linear-gradient(135deg, #1f4a78, #143058); }
    #rotateMsg { display: none; position: fixed; inset: 0; z-index: 200; background: #070b16; color: #fff; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font-size: 18px; font-weight: 800; letter-spacing: .1em; }
    #rotateMsg b { font-size: 56px; }
    @media (orientation: portrait) { body.mobile #rotateMsg { display: flex; } }
    body.mobile { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

    #touchUI { position: fixed; inset: 0; z-index: 60; pointer-events: none; display: none; }
    body.mobile.ingame #touchUI { display: block; }
    #touchUI .joy { position: fixed; top: 0; bottom: 0; width: 50%; touch-action: none; pointer-events: auto; }
    #touchUI .jbase { position: fixed; display: none; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.28); pointer-events: none; }
    #touchUI .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.65); }
    #touchUI .tbtns { position: fixed; bottom: max(22px, env(safe-area-inset-bottom)); display: flex; gap: 14px; align-items: flex-end; pointer-events: none; }
    #touchUI .tbtn { width: 70px; height: 70px; margin: 0; padding: 0; border-radius: 50%; font-size: 13px; font-weight: 800; touch-action: none; pointer-events: auto; background: rgba(10,16,34,.55); border: 2px solid; transform: none; }
    #touchUI .tbtn.skl { margin-bottom: 26px; }
    #touchUI .tbtn:hover:not(:disabled) { transform: none; box-shadow: none; }
    #touchUI .tbtn.down { filter: brightness(1.8); }
    #touchUI .tp1 .joy { left: 0; }
    #touchUI .tp1 .tbtn { border-color: #3aa0ff; }
    #touchUI .tp1 .tbtns { left: 156px; }
    #touchUI .tp2 .joy { right: 0; }
    #touchUI .tp2 .tbtn { border-color: #ff4d6d; }
    #touchUI .tp2 .tbtns { right: 156px; flex-direction: row-reverse; }
    #touchUI.online .tp2 { display: none; }
    #touchUI.online .tp1 .tbtns { left: auto; right: max(18px, env(safe-area-inset-right)); flex-direction: row-reverse; }

    body.mobile.ingame { overflow: hidden; height: var(--app-h, 100vh); touch-action: none; }
    body.mobile.ingame #backBtn { top: auto; bottom: 4px; left: 50%; transform: translateX(-50%); padding: 3px 10px; font-size: 11px; opacity: .75; }

<body>
  <canvas id="menuBg"></canvas>

  <!-- ホーム画面 -->

let safeZone = {

let lastPoisonTick = 0;

    // キャラ名と画像ファイルの対応
const characterImages = {

    function mapGimmicks(mapName) {
      const d = MAP_DEFS[mapName] || MAP_DEFS["草原"], out = [];
      if (d.base.some(o => o.brk)) out.push("brk");
      if (d.base.some(o => o.mir)) out.push("mir");

    function getObstaclesForMap(mapName) {
      const def = MAP_DEFS[mapName] || MAP_DEFS["草原"];
      const out = [], seen = new Set();
      const push = o => {
        const k = o.x + "," + o.y + "," + o.w + "," + o.h;
        if (seen.has(k)) return;
        seen.add(k);
        const n = { x: o.x, y: o.y, w: o.w, h: o.h };
        if (o.brk) { n.brk = true; n.hp = WALL_HP; }
        if (o.mir) n.mir = true;
        out.push(n);
      };
      def.base.forEach(o => {
        push(o);
        push({ x: ARENA_W - o.x - o.w, y: ARENA_H - o.y - o.h, w: o.w, h: o.h, brk: o.brk, mir: o.mir });
      });
      return out;
    }

    /* ワープ・回復パッド（座標は中心）。ワープは「基準位置 ↔ 180度回転した位置」で対になる */
    function getGimmicksForMap(mapName) {
      const def = MAP_DEFS[mapName] || MAP_DEFS["草原"];
      const warps = [], pads = [], seen = new Set();
      (def.warps || []).forEach((w, k) => {
        const n = warps.length;
        warps.push({ x: w.x, y: w.y, pair: k, to: n + 1 });
        warps.push({ x: ARENA_W - w.x, y: ARENA_H - w.y, pair: k, to: n });
      });
      (def.pads || []).forEach(p => {
        [{ x: p.x, y: p.y }, { x: ARENA_W - p.x, y: ARENA_H - p.y }].forEach(q => {
          const key = q.x + "," + q.y;
          if (!seen.has(key)) { seen.add(key); pads.push(q); }
        });
      });
      return { warps, pads };
    }

      const g = getGimmicksForMap(mapName);

    function damageWall(o, n) {
      if (!o || !o.brk) return;
      o.hp -= n;
      if (o.hp <= 0) {
        const i = obstacles.indexOf(o);
        if (i >= 0) obstacles.splice(i, 1);
        explosions.push({ x: o.x + o.w / 2, y: o.y + o.h / 2, r: Math.max(22, Math.max(o.w, o.h) * 0.6), life: 12 });
      }
    }

    function reflectBullet(b, o) {
      const px = b.x - b.vx, py = b.y - b.vy;
      const inX = px >= o.x - b.r && px <= o.x + o.w + b.r;
      const inY = py >= o.y - b.r && py <= o.y + o.h + b.r;
      if (!inX && inY) b.vx = -b.vx;
      else if (inX && !inY) b.vy = -b.vy;
      else { b.vx = -b.vx; b.vy = -b.vy; }
      b.x = px; b.y = py;
      b.bn = (b.bn || 0) + 1;
    }

    function warpBullet(b) {
      if (!warps.length) return;
      const idx = warps.findIndex(w => Math.hypot(b.x - w.x, b.y - w.y) < WARP_R - 2);
      if (idx < 0) { b.wlock = false; return; }
      if (b.wlock) return;
      const d = warps[warps[idx].to];
      b.x = d.x; b.y = d.y; b.wlock = true;
    }

    function updateGimmicks() {
      if (!warps.length && !pads.length) return;
      const now = Date.now();
      [player1, player2].forEach(p => {
        if (!p || p.hp <= 0) return;
        if (warps.length) {
          const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
          const idx = warps.findIndex(w => Math.hypot(cx - w.x, cy - w.y) < WARP_R);
          if (idx < 0) p.warpLock = false;
          else if (!p.warpLock && now >= (p.warpUntil || 0)) {
            const d = warps[warps[idx].to];
            explosions.push({ x: cx, y: cy, r: 16, life: 8 });
            p.x = d.x - p.w / 2; p.y = d.y - p.h / 2;
            p.warpLock = true; p.warpUntil = now + WARP_COOLDOWN;
            explosions.push({ x: d.x, y: d.y, r: 16, life: 8 });
          }
        }
        pads.forEach(pd => {
          if (now < pd.next || p.hp >= 100) return;
          if (circleHitRect({ x: pd.x, y: pd.y, r: PAD_R - 4 }, p)) {
            p.hp = Math.min(100, p.hp + PAD_HEAL);
            pd.next = now + PAD_RESPAWN;
          }
        });
      });
    }

  <!-- ver14 追加機能 -->
  <script>
    /* ============================================================
       ver14 追加機能：メニュー演出 / キャラ図鑑 / オンライン対戦
       ※ 上のオフライン対戦用スクリプトは変更していません。
         ここでは既存の関数（createPlayer, shootBullet, useSkill, update, draw など）を
         そのまま再利用しています。
       ============================================================ */

    /* ---------- 画面管理（新しい画面も隠せるように上書き） ---------- */
    const ALL_SCREENS = ["homeScreen","characterSelect","mapSelect","gameScreen","resultScreen",
                         "onlineMenu","onlineLobby","onlineResult","codexScreen"];
    function hideAllScreens() {
      ALL_SCREENS.forEach(id => document.getElementById(id).classList.add("hidden"));
    }
    function showScreen(id) {
      hideAllScreens();
      document.getElementById(id).classList.remove("hidden");
    }

    const _origReturnToMenu = returnToMenu;
    returnToMenu = function () {
      onlineCleanup();
      _origReturnToMenu();
    };

    function backToMenu() {
      const inGame = !document.getElementById("gameScreen").classList.contains("hidden");
      if (inGame && !confirm("対戦を中断してメニューに戻りますか？")) return;
      onlineCleanup();
      gameActive = false;
      returnToMenu();
    }

    // ホーム以外では「メニューへ」ボタンを表示
    setInterval(() => {
      const home = document.getElementById("homeScreen").classList.contains("hidden");
      document.getElementById("backBtn").classList.toggle("hidden", !home);
    }, 200);

    /* ---------- ホーム背景アニメーション ---------- */
    (function () {
      const c = document.getElementById("menuBg");
      const g = c.getContext("2d");
      let W = 0, H = 0;
      function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
      resize(); addEventListener("resize", resize);
      const streaks = Array.from({ length: 36 }, () => ({
        x: Math.random() * 2000, y: Math.random() * 1200,
        len: 40 + Math.random() * 140, sp: 2 + Math.random() * 6,
        hue: Math.random() < 0.7 ? 190 : 330
      }));
      let t = 0;
      function frame() {
        requestAnimationFrame(frame);
        if (!document.getElementById("gameScreen").classList.contains("hidden")) return; // 対戦中は止める
        t++;
        g.clearRect(0, 0, W, H);
        // グリッド
        g.strokeStyle = "rgba(0,229,255,0.06)"; g.lineWidth = 1;
        const gs = 48, off = (t * 0.4) % gs;
        for (let x = -gs + off; x < W; x += gs) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
        for (let y = -gs + off; y < H; y += gs) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
        // 流れる弾道
        streaks.forEach(s => {
          s.x += s.sp; s.y -= s.sp * 0.35;
          if (s.x - s.len > W || s.y < -20) { s.x = -s.len - Math.random() * 400; s.y = Math.random() * H + 100; }
          const grad = g.createLinearGradient(s.x - s.len, s.y + s.len * 0.35, s.x, s.y);
          grad.addColorStop(0, `hsla(${s.hue},100%,60%,0)`);
          grad.addColorStop(1, `hsla(${s.hue},100%,65%,0.75)`);
          g.strokeStyle = grad; g.lineWidth = 2;
          g.beginPath(); g.moveTo(s.x - s.len, s.y + s.len * 0.35); g.lineTo(s.x, s.y); g.stroke();
          g.fillStyle = `hsla(${s.hue},100%,75%,0.9)`;
          g.beginPath(); g.arc(s.x, s.y, 2.5, 0, Math.PI * 2); g.fill();
        });
      }
      frame();
    })();

    /* ---------- 共通ヘルパ ---------- */
    const CHAR_NAMES = Object.keys(characterImages);
    const MAP_NAMES = ["草原","雪原","都市","火山","宇宙","海辺","ジャングル","工場"];

    function imgOrPlaceholder(name, cls) {
      const src = characterImages[name];
      const alt = name.replace(/"/g, "");
      return src
        ? `<img src="${src}" alt="${alt}" ${cls ? `class="${cls}"` : ""} onerror="this.outerHTML='<div class=\\'cx-ph\\'>？</div>'">`
        : `<div class="cx-ph">？</div>`;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));
    }

    /* ============================================================
       キャラ図鑑
       ============================================================ */
    let codexBuilt = false;
    function charStats(name) {
      const p = createPlayer(0, 0, "", name); // ゲーム本体と同じ設定値を取得
      const shots = p.bulletsPerShot || 1;
      return {
        hp: p.hp, speed: p.speed,
        dmg: p.damage, shots, power: p.damage * shots,
        ammo: p.maxAmmo, reload: p.reloadTime / 1000,
        skillCt: isFinite(p.skillCooldown) ? p.skillCooldown / 1000 : Infinity
      };
    }
    function showCodex() {
      showScreen("codexScreen");
      if (!codexBuilt) {
        const grid = document.getElementById("codexGrid");
        grid.innerHTML = CHAR_NAMES.map(n =>
          `<button class="cx-item" data-name="${escapeHtml(n)}">${imgOrPlaceholder(n)}<span>${escapeHtml(n)}</span></button>`
        ).join("");
        grid.querySelectorAll(".cx-item").forEach(b => b.addEventListener("click", () => selectCodex(b.dataset.name)));
        codexBuilt = true;
        selectCodex(CHAR_NAMES[0]);
      }
    }
    function selectCodex(name) {
      document.querySelectorAll(".cx-item").forEach(b => b.classList.toggle("active", b.dataset.name === name));
      const st = charStats(name);
      const all = CHAR_NAMES.map(charStats);
      const maxSpeed = Math.max(...all.map(s => s.speed));
      const maxPower = Math.max(...all.map(s => s.power));
      const finiteAmmo = all.map(s => s.ammo).filter(a => a < 100);
      const maxAmmo = Math.max(...finiteAmmo);
      const maxRate = Math.max(...all.map(s => 1 / s.reload));
      const maxSkill = Math.max(...all.filter(s => isFinite(s.skillCt) && s.skillCt >= 2).map(s => 1 / s.skillCt));

      const pct = v => Math.max(4, Math.min(100, Math.round(v * 100)));
      const rows = [
        ["移動速度", pct(st.speed / maxSpeed), st.speed.toFixed(1)],
        ["攻撃力",   pct(st.power / maxPower), st.shots > 1 ? `${st.dmg}×${st.shots}` : `${st.dmg}`],
        ["装弾数",   st.ammo >= 100 ? 100 : pct(st.ammo / maxAmmo), st.ammo >= 100 ? "∞" : `${st.ammo}発`],
        ["リロード", pct((1 / st.reload) / maxRate), `${st.reload.toFixed(1)}秒`],
        ["スキル回転", isFinite(st.skillCt) ? pct((1 / st.skillCt) / maxSkill) : 4, isFinite(st.skillCt) ? `${st.skillCt}秒` : "チャージ式"]
      ];
      const info = (typeof CHARACTER_INFO !== "undefined" && CHARACTER_INFO[name]) || {};
      const sec = (label, text) => `<div class="cd-sec"><h4>${label}</h4><p>${escapeHtml(text || "（未設定）")}</p></div>`;

      document.getElementById("codexDetail").innerHTML = `
        <div class="cd-head">
          ${imgOrPlaceholder(name)}
          <div>
            <div class="cd-name">${escapeHtml(name)}</div>
            <div class="cd-title">${escapeHtml(info.title || "")}</div>
            <div class="keyhelp">HP ${st.hp}</div>
          </div>
        </div>
        <div style="margin-top:14px">
          ${rows.map(r => `<div class="stat"><span>${r[0]}</span><div class="bar"><i style="width:${r[1]}%"></i></div><span class="val">${r[2]}</span></div>`).join("")}
        </div>
        ${sec("紹介", info.intro)}
        ${sec("通常攻撃", info.attack)}
        ${sec("スキル", info.skill)}
        ${sec("立ち回りのコツ", info.tips)}
        <div class="note">※ ステータスはゲーム内の設定値から自動表示（バーは全キャラ中の相対値）。スキルなどの特殊効果は含まれません。</div>`;
    }

    /* ============================================================
       オンライン対戦（PeerJS / ホスト権威方式）
         ホスト = 1P(青)：ゲーム計算を実行し、状態を配信
         ゲスト = 2P(赤)：入力を送信し、受け取った状態を描画
       ============================================================ */
    function myName() { return (window.Account && window.Account.name && window.Account.name()) || "ゲスト"; }
    const PEER_PREFIX = "tsg-battle-v14-";
    const onl = {
      peer: null, conn: null, isHost: false, code: "",
      myChar: CHAR_NAMES[0], oppChar: "", map: MAP_NAMES[0],
      guestReady: false, running: false,
      raf: 0, hbTimer: 0, keepTimer: 0, lastTs: 0, acc: 0, lastSend: 0, lastObCount: -1,
      dirs: { u: false, d: false, l: false, r: false }, lastDirsSent: ""
    };

    /* 画面スリープ防止／バックグラウンド復帰時にシグナリング再接続（ルームIDを維持） */
    let wakeLock = null;
    async function keepAwake() {
      try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {}
    }
    function releaseAwake() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
    function onlineWake() {
      const p = onl.peer;
      if (p && onl.isHost && p.disconnected && !p.destroyed) { try { p.reconnect(); } catch (e) {} }
      if (p) keepAwake();
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden) onlineWake(); });
    window.addEventListener("online", onlineWake);
    window.addEventListener("pageshow", onlineWake);
    window.addEventListener("focus", onlineWake);

    function setOnlineStatus(msg, isErr) {
      const el = document.getElementById("onlineStatus");
      el.textContent = msg || "";
      el.classList.toggle("err", !!isErr);
    }
    function setLobbyStatus(msg, isErr) {
      const el = document.getElementById("lobbyStatus");
      el.textContent = msg || "";
      el.classList.toggle("err", !!isErr);
    }
    /* 状態配信：送信バッファが詰まっているときは古い状態を捨てて遅延の蓄積を防ぐ（障害物の更新だけは必ず送る） */
    function sendSnapMsg(m) {
      const c = onl.conn;
      if (!c || !c.open) return;
      const dc = c.dataChannel;
      if (dc && dc.bufferedAmount > 8192 && !m.ob) return;
      try { c.send(m); } catch (e) { console.warn(e); }
    }
    function sendMsg(m) {
      if (onl.conn && onl.conn.open) { try { onl.conn.send(m); } catch (e) { console.warn(e); } }
    }

    function onlineCleanup() {
      clearInterval(onl.keepTimer); releaseAwake();
      onl.running = false;
      cancelAnimationFrame(onl.raf);
      clearInterval(onl.hbTimer);
      document.removeEventListener("keydown", onlineKeyDown);
      document.removeEventListener("keyup", onlineKeyUp);
      window.removeEventListener("blur", onlineBlur);
      const c = onl.conn, p = onl.peer;
      onl.conn = null; onl.peer = null;
      try { if (c) c.close(); } catch (e) {}
      try { if (p) p.destroy(); } catch (e) {}
      onl.isHost = false; onl.oppChar = ""; onl.oppName = ""; onl.guestReady = false; onl.code = "";
      try { if (window.Account && window.Account.dropInvites) window.Account.dropInvites(); } catch (e) {}
      onl.dirs = { u: false, d: false, l: false, r: false }; onl.lastDirsSent = "";
    }

    function showOnlineMenu(msg, isErr) {
      onlineCleanup();
      showScreen("onlineMenu");
      setOnlineStatus(msg || "", isErr);
      if (typeof Peer === "undefined") {
        setOnlineStatus("通信ライブラリ(PeerJS)を読み込めませんでした。インターネット接続を確認してください。", true);
      }
    }

    function randomCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let s = "";
      for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }

    /* ----- ルーム作成（ホスト） ----- */
    function onlineCreateRoom(attempt) {
      attempt = attempt || 0;
      if (typeof Peer === "undefined") { setOnlineStatus("通信ライブラリを読み込めていません。", true); return; }
      if (attempt === 0) onlineCleanup();
      setOnlineStatus("ルームを作成中…");
      const code = randomCode();
      const peer = new Peer(PEER_PREFIX + code);
      onl.peer = peer;
      let opened = false;
      const revive = () => { if (onl.peer !== peer || peer.destroyed) return; if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} } };
      peer.on("disconnected", () => setTimeout(revive, 300));
      peer.on("open", () => {
        if (opened) return; // 再接続時のopenでは何もしない
        opened = true;
        clearInterval(onl.keepTimer); onl.keepTimer = setInterval(revive, 2000);
        keepAwake();
        onl.isHost = true; onl.code = code;
        onl.myChar = CHAR_NAMES[0]; onl.oppChar = ""; onl.guestReady = false;
        enterLobby();
      });
      peer.on("connection", onHostConnection);
      peer.on("error", err => {
        if (onl.peer !== peer) return;
        if (opened) { setTimeout(revive, 1000); return; } // 作成後の通信エラーは再接続で対処（ルームは維持）
        if (err.type === "unavailable-id" && attempt < 5) {
          try { peer.destroy(); } catch (e) {}
          onl.peer = null;
          onlineCreateRoom(attempt + 1);
        } else {
          setOnlineStatus("ルーム作成に失敗しました（" + err.type + "）", true);
        }
      });
    }

    function onHostConnection(conn) {
      if (onl.conn && onl.conn.open) { conn.on("open", () => conn.close()); return; } // 満員
      onl.conn = conn;
      conn.on("open", () => {
        sendMsg({ t: "char", v: onl.myChar });
        sendMsg({ t: "name", v: myName() });
        sendMsg({ t: "map", v: onl.map });
        updateLobby();
      });
      conn.on("data", onMessage);
      conn.on("close", () => { if (onl.conn === conn) onPeerLeft(); });
      conn.on("error", () => { if (onl.conn === conn) onPeerLeft(); });
    }

    /* ----- ルーム参加（ゲスト） ----- */
    function onlineJoinRoom() {
      if (typeof Peer === "undefined") { setOnlineStatus("通信ライブラリを読み込めていません。", true); return; }
      const code = document.getElementById("roomCodeInput").value.toUpperCase().trim();
      if (code.length !== 4) { setOnlineStatus("4文字のルームコードを入力してください。", true); return; }
      onlineCleanup();
      setOnlineStatus("接続中…");
      const peer = new Peer();
      onl.peer = peer;
      let timer = 0;
      const fail = msg => { clearTimeout(timer); if (onl.peer === peer) { showOnlineMenu(msg, true); } };
      peer.on("open", () => {
        const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: "json" });
        onl.conn = conn;
        keepAwake();
        timer = setTimeout(() => { if (!conn.open) fail("接続がタイムアウトしました。コードを確認してもう一度試してください。"); }, 12000);
        conn.on("open", () => {
          clearTimeout(timer);
          onl.isHost = false; onl.code = code;
          onl.myChar = CHAR_NAMES[0]; onl.oppChar = ""; onl.guestReady = false;
          sendMsg({ t: "char", v: onl.myChar });
          sendMsg({ t: "name", v: myName() });
          enterLobby();
        });
        conn.on("data", onMessage);
        conn.on("close", () => { if (onl.conn === conn) onPeerLeft(); });
        conn.on("error", () => { if (onl.conn === conn) onPeerLeft(); });
      });
      peer.on("error", err => {
        if (err.type === "peer-unavailable") fail("ルームが見つかりません。コードを確認してください。");
        else fail("接続エラー（" + err.type + "）");
      });
    }

    function onPeerLeft() {
      if (onl.isHost) {
        const wasRunning = onl.running;
        onl.running = false; gameActive = false;
        cancelAnimationFrame(onl.raf);
        document.removeEventListener("keydown", onlineKeyDown);
        document.removeEventListener("keyup", onlineKeyUp);
        onl.conn = null; onl.oppChar = ""; onl.guestReady = false;
        showScreen("onlineLobby");
        updateLobby();
        setLobbyStatus(wasRunning ? "相手が切断しました。" : "相手が退出しました。", true);
      } else {
        showOnlineMenu("ホストとの接続が切れました。", true);
      }
    }

    function copyRoomCode() {
      const t = onl.code;
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => setLobbyStatus("コードをコピーしました: " + t), () => {});
    }
    function toggleReady() {
      onl.guestReady = !onl.guestReady;
      sendMsg({ t: "ready", v: onl.guestReady });
      updateLobby();
    }
    function backToLobby() {
      onl.running = false; gameActive = false;
      if (!onl.isHost) { onl.guestReady = false; sendMsg({ t: "ready", v: false }); }
      showScreen("onlineLobby");
      updateLobby();
    }

    /* ----- メッセージ受信 ----- */
    function onMessage(m) {
      if (!m || !m.t) return;
      switch (m.t) {
        case "char":  onl.oppChar = m.v; updateLobby(); break;
        case "name":  onl.oppName = String(m.v || "ゲスト").slice(0, 16); updateLobby(); break;
        case "map":   if (!onl.isHost) { onl.map = m.v; updateLobby(); } break;
        case "ready": if (onl.isHost) { onl.guestReady = !!m.v; updateLobby(); } break;
        case "start": if (!onl.isHost) beginMatch(m.p1, m.p2, m.map); break;
        case "snap":  if (!onl.isHost && onl.running) applySnap(m); break;
        case "over":  if (!onl.isHost) { finishMatch(m.w); } break;
        case "in":
          if (onl.isHost && onl.running) {
            keys["ArrowUp"] = !!m.u; keys["ArrowDown"] = !!m.d;
            keys["ArrowLeft"] = !!m.l; keys["ArrowRight"] = !!m.r;
          }
          break;
        case "shoot": if (onl.isHost && onl.running && gameActive) shootBullet(player2, player1); break;
        case "skill": if (onl.isHost && onl.running && gameActive) useSkill(player2); break;
      }
    }

    /* ----- 試合開始 ----- */
    function hostStartGame() {
      if (!onl.isHost || !onl.conn || !onl.conn.open || !onl.guestReady) return;
      sendMsg({ t: "start", p1: onl.myChar, p2: onl.oppChar, map: onl.map });
      beginMatch(onl.myChar, onl.oppChar, onl.map);
    }

    function beginMatch(p1Name, p2Name, mapName) {
      showScreen("gameScreen");
      const role = onl.isHost ? "1P（青）" : "2P（赤）";
      document.getElementById("gameInfo").innerText =
        `1P: ${p1Name} vs 2P: ${p2Name} | マップ: ${mapName} | あなたは ${role}`;

      canvas = document.getElementById("gameCanvas");
      ctx = canvas.getContext("2d");
      selectedMap = mapName;

      // オフライン用のキー入力は外す（オンラインは専用ハンドラで統一）
      document.removeEventListener("keydown", keyDownHandler);
      document.removeEventListener("keyup", keyUpHandler);

      player1 = createPlayer(SPAWNS.p1.x, SPAWNS.p1.y, "blue", p1Name);
      player2 = createPlayer(SPAWNS.p2.x, SPAWNS.p2.y, "red", p2Name);
      bullets = []; turrets = []; explosions = []; keys = {};
      obstacles = onl.isHost ? getObstaclesForMap(mapName) : [];
      initGimmicks(mapName);
      safeZone.x = canvas.width / 2;
      safeZone.y = canvas.height / 2;
      safeZone.radius = Math.max(canvas.width, canvas.height);
      safeZone.shrinking = false;

      onl.dirs = { u: false, d: false, l: false, r: false };
      onl.lastDirsSent = "";
      document.addEventListener("keydown", onlineKeyDown);
      document.addEventListener("keyup", onlineKeyUp);
      window.addEventListener("blur", onlineBlur);

      onl.running = true;
      cancelAnimationFrame(onl.raf);
      clearInterval(onl.hbTimer);

      if (onl.isHost) {
        gameActive = true;
        gameStartTime = Date.now();
        lastPoisonTick = Date.now();
        onl.acc = 0; onl.lastTs = performance.now(); onl.lastSend = 0; onl.lastObCount = -1;
        onl.raf = requestAnimationFrame(hostLoop);
      } else {
        gameActive = false;
        onl.lastTs = performance.now();
        onl.hbTimer = setInterval(() => sendDirs(true), 100); // 入力の再送（取りこぼし対策）
        onl.raf = requestAnimationFrame(guestLoop);
      }
    }

    /* ----- ホスト：ゲームループ（60Hz固定） ----- */
    function hostLoop(ts) {
      if (!onl.running) return;
      onl.acc += Math.min(ts - onl.lastTs, 200);
      onl.lastTs = ts;
      const STEP = 1000 / 60;
      while (onl.acc >= STEP) { update(); onl.acc -= STEP; }

      draw();
      drawYouMarker();

      if (ts - onl.lastSend >= 16) { sendSnapMsg(buildSnap()); onl.lastSend = ts; }

      if (player1.hp <= 0 || player2.hp <= 0) {
        gameActive = false;
        sendMsg(buildSnap());
        const w = (player1.hp <= 0 && player2.hp <= 0) ? "draw" : (player1.hp <= 0 ? "p2" : "p1");
        sendMsg({ t: "over", w });
        finishMatch(w);
        return;
      }
      onl.raf = requestAnimationFrame(hostLoop);
    }

    function r1(v) { return Math.round((v || 0) * 10) / 10; }
    function buildSnap() {
      const now = Date.now();
      const s = {
        t: "snap",
        p: [player1, player2].map(p => ({
          x: r1(p.x), y: r1(p.y), hp: r1(p.hp),
          am: p.ammo, mx: p.maxAmmo, md: p.mode || null, sc: p.skillCharge || 0,
          cd: isFinite(p.skillCooldown) ? p.skillCooldown : null,
          se: now - p.skillLastUsed
        })),
        b: bullets.map(b => [r1(b.x), r1(b.y), r1(b.vx), r1(b.vy), r1(b.r), b.from === player1 ? 1 : 2]),
        tu: turrets.map(t => [r1(t.x), r1(t.y), t.owner === player1 ? 1 : 2]),
        ex: explosions.map(e => [r1(e.x), r1(e.y), r1(e.r), e.life]),
        sz: [safeZone.x, safeZone.y, r1(safeZone.radius), safeZone.shrinking ? 1 : 0, now - gameStartTime],
        pd: pads.map(p => Math.max(0, Math.round(p.next - now)))
      };
      const obSig = obstacles.map(o => o.x + "," + o.y + "," + (o.hp || 0)).join(";");
      if (obSig !== onl.lastObCount) {
        s.ob = obstacles.map(o => [o.x, o.y, o.w, o.h, o.brk ? 1 : (o.mir ? 2 : 0), o.hp || 0]);
        onl.lastObCount = obSig;
      }
      return s;
    }

    /* ----- ゲスト：描画ループ ----- */
    function applySnap(s) {
      [player1, player2].forEach((p, i) => {
        const d = s.p[i];
        if (!p || !d) return;
        p.tx = d.x; p.ty = d.y;
        if (p.snapped !== true) { p.x = d.x; p.y = d.y; p.snapped = true; }
        p.hp = d.hp; p.ammo = d.am; p.maxAmmo = d.mx; p.mode = d.md; p.skillCharge = d.sc;
        p.skillCooldown = d.cd === null ? Infinity : d.cd;
        p.skillLastUsed = Date.now() - d.se;
      });
      bullets = s.b.map(a => ({ x: a[0], y: a[1], vx: a[2], vy: a[3], r: a[4], own: a[5] }));
      turrets = s.tu.map(a => ({ x: a[0], y: a[1], own: a[2] }));
      explosions = s.ex.map(a => ({ x: a[0], y: a[1], r: a[2], life: a[3] }));
      if (s.ob) obstacles = s.ob.map(a => { const o = { x: a[0], y: a[1], w: a[2], h: a[3] }; if (a[4] === 1) { o.brk = true; o.hp = a[5]; } if (a[4] === 2) o.mir = true; return o; });
      if (s.pd) s.pd.forEach((rem, i) => { if (pads[i]) pads[i].next = Date.now() + rem; });
      safeZone.x = s.sz[0]; safeZone.y = s.sz[1]; safeZone.radius = s.sz[2]; safeZone.shrinking = !!s.sz[3];
      gameStartTime = Date.now() - (s.sz[4] || 0);
    }

    function guestLoop(ts) {
      if (!onl.running) return;
      const dt = Math.min((ts - onl.lastTs) / (1000 / 60), 3);
      onl.lastTs = ts;
      bullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; }); // 弾は次の状態が来るまで先読み
      [player1, player2].forEach(p => {
        if (p.tx === undefined) return;
        if (Math.hypot(p.tx - p.x, p.ty - p.y) > 90) { p.x = p.tx; p.y = p.ty; } // ワープは補間せず即移動
        const k = Math.min(1, 0.5 * dt);
        p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k;
      });
      draw();
      drawYouMarker();
      onl.raf = requestAnimationFrame(guestLoop);
    }

    /* ----- 試合終了 ----- */
    function finishMatch(w) {
      onl.running = false;
      gameActive = false;
      cancelAnimationFrame(onl.raf);
      clearInterval(onl.hbTimer);
      keys = {};
      if (onl.isHost) onl.guestReady = false;
      const me = onl.isHost ? "p1" : "p2";
      document.getElementById("onlineResultText").textContent =
        w === "draw" ? "引き分け！" : (w === me ? "あなたの勝ち！ 🎉" : "あなたの負け…");
      showScreen("onlineResult");
    }

    /* ----- オンライン用キー入力（両者共通：移動 WASD/矢印, 攻撃 F, スキル G） ----- */
    const DIR_KEYS = { w: "u", ArrowUp: "u", s: "d", ArrowDown: "d", a: "l", ArrowLeft: "l", d: "r", ArrowRight: "r" };
    function normKey(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key; }

    function sendDirs(force) {
      const d = onl.dirs;
      if (onl.isHost) {
        keys["w"] = d.u; keys["s"] = d.d; keys["a"] = d.l; keys["d"] = d.r;
        return;
      }
      const sig = [d.u, d.d, d.l, d.r].map(Number).join("");
      if (force || sig !== onl.lastDirsSent) {
        sendMsg({ t: "in", u: d.u, d: d.d, l: d.l, r: d.r });
        onl.lastDirsSent = sig;
      }
    }
    function onlineKeyDown(e) {
      const k = normKey(e);
      if (k.startsWith("Arrow") || k === " ") e.preventDefault();
      if (!onl.running) return;
      if (DIR_KEYS[k]) { onl.dirs[DIR_KEYS[k]] = true; sendDirs(); return; }
      if (k === "f") { onl.isHost ? (gameActive && shootBullet(player1, player2)) : sendMsg({ t: "shoot" }); }
      if (k === "g") { onl.isHost ? (gameActive && useSkill(player1)) : sendMsg({ t: "skill" }); }
    }
    function onlineKeyUp(e) {
      const k = normKey(e);
      if (!onl.running) return;
      if (DIR_KEYS[k]) { onl.dirs[DIR_KEYS[k]] = false; sendDirs(); }
    }
    function onlineBlur() {
      onl.dirs = { u: false, d: false, l: false, r: false };
      sendDirs();
    }

    // ルームコード入力：Enterで参加
    document.getElementById("roomCodeInput").addEventListener("keydown", e => {
      if (e.key === "Enter") onlineJoinRoom();
    });
    window.addEventListener("beforeunload", () => { try { if (onl.conn) onl.conn.close(); } catch (e) {} });
  </script>

      "火山":     { floor: ["#3d1b14", "#1a0b0a"], grid: "rgba(255,120,60,.06)",  accent: "#ff7a3d", deco: "volcano", obs: { style: "basalt",    top: "#4b3b39", side: "#231918", edge: "#ff6a2a" } },
      "宇宙":     { floor: ["#171b40", "#07091d"], grid: "rgba(150,170,255,.06)", accent: "#b49bff", deco: "space",   obs: { style: "rock",      top: "#8d92ab", side: "#4a4e66", edge: "#22253a" } },
      "海辺":     { floor: ["#7a6440", "#46391f"], grid: "rgba(255,240,200,.07)", accent: "#5fe3d0", deco: "beach",   obs: { style: "dune",      top: "#f0d79a", side: "#b8975a", edge: "#6b5530" } },
      "ジャングル": { floor: ["#17402a", "#0a2015"], grid: "rgba(150,255,150,.05)", accent: "#9dff6a", deco: "jungle",  obs: { style: "tree",      top: "#2f8a4a", side: "#1d5c32", edge: "#0a2f18" } },
      "工場":     { floor: ["#3a3f47", "#1f2329"], grid: "rgba(255,255,255,.06)", accent: "#ffb020", deco: "factory", obs: { style: "container", top: "#c25b2a", side: "#7a3a1a", edge: "#2a1408" } }
    };
    const CONTAINER_PAL = [
      { top: "#d2652d", side: "#7e3b1a" }, { top: "#2f74b5", side: "#1a4468" }, { top: "#4f9a5a", side: "#2b5a33" }
    ];

    function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
    function hashPos(o, n) { return Math.abs((o.x * 31 + o.y * 17 + o.w * 7 + o.h * 3) | 0) % n; }
    function rrect(g, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      g.beginPath(); g.moveTo(x + r, y);
      g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
      g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
    }
    function hazard(g, x, y, w, h) {
      g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
      g.fillStyle = "rgba(255,176,32,.22)"; g.fillRect(x, y, w, h);
      g.fillStyle = "rgba(0,0,0,.35)";
      for (let k = -h; k < w + h; k += 16) {
        g.beginPath(); g.moveTo(x + k, y + h); g.lineTo(x + k + 8, y + h); g.lineTo(x + k + 8 + h, y); g.lineTo(x + k + h, y); g.closePath(); g.fill();
      }
      g.restore();
    }

    /* ---------- 床の装飾 ---------- */
    const DECO = {
      grass(g, r) {
        for (let i = 0; i < 320; i++) {
          const x = r() * ARENA_W, y = r() * ARENA_H, l = 3 + r() * 6;
          g.strokeStyle = `rgba(150,230,150,${(.10 + r() * .14).toFixed(2)})`; g.lineWidth = 1;
          g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - .5) * 3, y - l); g.stroke();
        }
        g.fillStyle = "rgba(255,240,170,.3)";
        for (let i = 0; i < 18; i++) { g.beginPath(); g.arc(r() * ARENA_W, r() * ARENA_H, 1.6, 0, TAU); g.fill(); }
      },
      snow(g, r) {
        g.fillStyle = "rgba(255,255,255,.18)";
        for (let i = 0; i < 200; i++) { g.beginPath(); g.arc(r() * ARENA_W, r() * ARENA_H, .6 + r() * 1.4, 0, TAU); g.fill(); }
        g.strokeStyle = "rgba(190,230,255,.16)"; g.lineWidth = 1.2;
        for (let i = 0; i < 9; i++) {
          let x = r() * ARENA_W, y = r() * ARENA_H; g.beginPath(); g.moveTo(x, y);
          for (let k = 0; k < 4; k++) { x += (r() - .5) * 70; y += (r() - .5) * 50; g.lineTo(x, y); } g.stroke();
        }
      },
      city(g) {
        g.fillStyle = "rgba(255,255,255,.045)"; g.fillRect(0, 0, ARENA_W, 16); g.fillRect(0, ARENA_H - 16, ARENA_W, 16);
        g.strokeStyle = "rgba(255,209,102,.30)"; g.lineWidth = 3; g.setLineDash([22, 16]);
        g.beginPath(); g.moveTo(0, ARENA_H / 2); g.lineTo(ARENA_W, ARENA_H / 2); g.stroke();
        g.beginPath(); g.moveTo(ARENA_W / 2, 0); g.lineTo(ARENA_W / 2, ARENA_H); g.stroke(); g.setLineDash([]);
        g.fillStyle = "rgba(255,255,255,.10)";
        [150, 626].forEach(x => { for (let y = 40; y < ARENA_H - 40; y += 16) g.fillRect(x, y, 24, 8); });
      },
      volcano(g, r) {
        for (let i = 0; i < 7; i++) {
          const x = r() * ARENA_W, y = r() * ARENA_H, R = 70 + r() * 50;
          const gr = g.createRadialGradient(x, y, 0, x, y, R);
          gr.addColorStop(0, "rgba(255,100,30,.20)"); gr.addColorStop(1, "rgba(255,100,30,0)");
          g.fillStyle = gr; g.fillRect(0, 0, ARENA_W, ARENA_H);
        }
        g.save(); g.strokeStyle = "rgba(255,120,50,.40)"; g.lineWidth = 1.5; g.shadowColor = "#ff6a2a"; g.shadowBlur = 8;
        for (let i = 0; i < 14; i++) {
          let x = r() * ARENA_W, y = r() * ARENA_H; g.beginPath(); g.moveTo(x, y);
          for (let k = 0; k < 5; k++) { x += (r() - .5) * 60; y += (r() - .5) * 60; g.lineTo(x, y); } g.stroke();
        }
        g.restore();
      },
      space(g, r) {
        [["rgba(120,80,255,.22)", 140], ["rgba(40,140,255,.18)", 170], ["rgba(255,80,180,.12)", 120]].forEach(([c, R]) => {
          const x = r() * ARENA_W, y = r() * ARENA_H, gr = g.createRadialGradient(x, y, 0, x, y, R);
          gr.addColorStop(0, c); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(0, 0, ARENA_W, ARENA_H);
        });
        for (let i = 0; i < 150; i++) { g.fillStyle = `rgba(255,255,255,${(.2 + r() * .7).toFixed(2)})`; g.beginPath(); g.arc(r() * ARENA_W, r() * ARENA_H, .4 + r() * 1.2, 0, TAU); g.fill(); }
      },
      beach(g, r) {
        g.fillStyle = "rgba(255,235,190,.12)";
        for (let i = 0; i < 260; i++) { g.beginPath(); g.arc(r() * ARENA_W, 24 + r() * (ARENA_H - 48), .8, 0, TAU); g.fill(); }
        const band = (y0, dir) => {
          const gr = g.createLinearGradient(0, y0, 0, y0 + dir * 26); gr.addColorStop(0, "#0b6f86"); gr.addColorStop(1, "#2fb6c4");
          g.fillStyle = gr; g.fillRect(0, dir > 0 ? y0 : y0 - 26, ARENA_W, 26);
          g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 2; g.beginPath();
          for (let x = 0; x <= ARENA_W; x += 6) { const y = y0 + dir * (26 + Math.sin(x / 14) * 3); x ? g.lineTo(x, y) : g.moveTo(x, y); }
          g.stroke();
        };
        band(0, 1); band(ARENA_H, -1);
      },
      jungle(g, r) {
        for (let i = 0; i < 46; i++) {
          g.fillStyle = `rgba(70,170,90,${(.08 + r() * .08).toFixed(2)})`;
          g.beginPath(); g.ellipse(r() * ARENA_W, r() * ARENA_H, 8 + r() * 18, 4 + r() * 8, r() * 3, 0, TAU); g.fill();
        }
        g.strokeStyle = "rgba(120,200,110,.12)"; g.lineWidth = 1.5;
        for (let i = 0; i < 10; i++) { let x = r() * ARENA_W, y = r() * ARENA_H; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 4; k++) { x += (r() - .5) * 80; y += (r() - .5) * 60; g.lineTo(x, y); } g.stroke(); }
      },
      factory(g) {
        g.strokeStyle = "rgba(0,0,0,.30)"; g.lineWidth = 2;
        for (let x = 100; x < ARENA_W; x += 100) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, ARENA_H); g.stroke(); }
        for (let y = 100; y < ARENA_H; y += 100) { g.beginPath(); g.moveTo(0, y); g.lineTo(ARENA_W, y); g.stroke(); }
        g.fillStyle = "rgba(255,255,255,.10)";
        for (let x = 100; x < ARENA_W; x += 100) for (let y = 100; y < ARENA_H; y += 100) { [[-6, -6], [6, -6], [-6, 6], [6, 6]].forEach(([dx, dy]) => { g.beginPath(); g.arc(x + dx, y + dy, 1.6, 0, TAU); g.fill(); }); }
        hazard(g, 392, 0, 16, ARENA_H); hazard(g, 0, 0, ARENA_W, 6); hazard(g, 0, ARENA_H - 6, ARENA_W, 6);
      }
    };

    /* ---------- 背景（マップごとにキャッシュ） ---------- */
    const bgCache = {};
    function getBg(mapName) {
      if (bgCache[mapName]) return bgCache[mapName];
      const th = MAP_THEME[mapName] || MAP_THEME["草原"];
      const c = document.createElement("canvas"); c.width = ARENA_W; c.height = ARENA_H;
      const g = c.getContext("2d");
      const r = rng(mapName.length * 977 + mapName.charCodeAt(0));
      const grad = g.createLinearGradient(0, 0, 0, ARENA_H); grad.addColorStop(0, th.floor[0]); grad.addColorStop(1, th.floor[1]);
      g.fillStyle = grad; g.fillRect(0, 0, ARENA_W, ARENA_H);
      DECO[th.deco](g, r);
      g.strokeStyle = th.grid; g.lineWidth = 1;
      for (let x = 40; x < ARENA_W; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, ARENA_H); g.stroke(); }
      for (let y = 40; y < ARENA_H; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(ARENA_W, y); g.stroke(); }
      // 中央マーク（最終安全地帯の目安）
      g.save(); g.strokeStyle = th.accent; g.globalAlpha = .28; g.lineWidth = 2; g.setLineDash([8, 8]);
      g.beginPath(); g.arc(ARENA_W / 2, ARENA_H / 2, 50, 0, TAU); g.stroke(); g.restore();
      // スポーンパッド
      [[1, SPAWNS.p1], [2, SPAWNS.p2]].forEach(([i, s]) => {
        const cx = s.x + 15, cy = s.y + 15, T = TEAM[i];
        const gr = g.createRadialGradient(cx, cy, 0, cx, cy, 60);
        gr.addColorStop(0, `rgba(${T.rgb},.38)`); gr.addColorStop(1, `rgba(${T.rgb},0)`);
        g.fillStyle = gr; g.fillRect(cx - 60, cy - 60, 120, 120);
        g.strokeStyle = `rgba(${T.rgb},.7)`; g.lineWidth = 2; g.setLineDash([6, 5]);
        g.beginPath(); g.arc(cx, cy, 36, 0, TAU); g.stroke(); g.setLineDash([]);
      });
      // ビネット
      const vg = g.createRadialGradient(ARENA_W / 2, ARENA_H / 2, 160, ARENA_W / 2, ARENA_H / 2, 480);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.5)");
      g.fillStyle = vg; g.fillRect(0, 0, ARENA_W, ARENA_H);
      // 枠
      g.strokeStyle = th.accent; g.globalAlpha = .55; g.lineWidth = 3; g.strokeRect(1.5, 1.5, ARENA_W - 3, ARENA_H - 3);
      g.globalAlpha = .95; g.lineWidth = 4; const L = 24;
      [[0, 0, 1, 1], [ARENA_W, 0, -1, 1], [0, ARENA_H, 1, -1], [ARENA_W, ARENA_H, -1, -1]].forEach(([x, y, sx, sy]) => {
        g.beginPath(); g.moveTo(x + sx * L, y + sy * 2); g.lineTo(x + sx * 2, y + sy * 2); g.lineTo(x + sx * 2, y + sy * L); g.stroke();
      });
      bgCache[mapName] = c; return c;
    }

    /* ---------- 障害物（2.5D） ---------- */
    /* ---------- ver18：ギミックの描画 ---------- */
    function drawBreakable(g, o) {
      const hp = o.hp === undefined ? WALL_HP : o.hp, dmg = Math.max(0, WALL_HP - hp);
      g.save();
      g.fillStyle = "rgba(0,0,0,.38)"; rrect(g, o.x + 4, o.y + 6, o.w, o.h, 3); g.fill();
      const D = Math.min(6, o.h * .3), topH = o.h - D;
      rrect(g, o.x, o.y, o.w, o.h, 3); g.fillStyle = "#6b4423"; g.fill();
      const gr = g.createLinearGradient(0, o.y, 0, o.y + topH);
      gr.addColorStop(0, "#e6ab66"); gr.addColorStop(1, "#b9803f");
      rrect(g, o.x, o.y, o.w, topH, 3); g.fillStyle = gr; g.fill();
      g.save(); rrect(g, o.x, o.y, o.w, topH, 3); g.clip();
      g.fillStyle = "rgba(40,24,8,.26)";
      for (let k = -topH; k < o.w + topH; k += 12) {
        g.beginPath(); g.moveTo(o.x + k, o.y + topH); g.lineTo(o.x + k + 6, o.y + topH);
        g.lineTo(o.x + k + 6 + topH, o.y); g.lineTo(o.x + k + topH, o.y); g.closePath(); g.fill();
      }
      g.strokeStyle = "rgba(25,12,0,.92)"; g.lineWidth = 1.7; g.lineJoin = "round";
      for (let k = 0; k < dmg; k++) {
        const r = rng(hashPos(o, 997) * 31 + k * 101 + 7);
        let x = o.x + r() * o.w, y = r() < .5 ? o.y : o.y + topH;
        g.beginPath(); g.moveTo(x, y);
        for (let s = 0; s < 3; s++) {
          x += (r() - .5) * Math.max(14, o.w * .5); y += (o.y + topH / 2 - y) * .5 + (r() - .5) * 8;
          g.lineTo(x, y);
        }
        g.stroke();
      }
      g.restore();
      g.lineWidth = 2; g.setLineDash([5, 3]); g.strokeStyle = "#ffd23f";
      rrect(g, o.x, o.y, o.w, topH, 3); g.stroke(); g.setLineDash([]);
      if (dmg > 0) {
        const pw = 5, gap = 2, tw = WALL_HP * pw + (WALL_HP - 1) * gap, bx = o.x + o.w / 2 - tw / 2, by = o.y - 8;
        g.fillStyle = "rgba(0,0,0,.6)"; g.fillRect(bx - 2, by - 2, tw + 4, 7);
        for (let k = 0; k < WALL_HP; k++) { g.fillStyle = k < hp ? "#ffd23f" : "rgba(255,255,255,.18)"; g.fillRect(bx + k * (pw + gap), by, pw, 3); }
      }
      g.restore();
    }

    function drawMirror(g, o) {
      g.save();
      g.fillStyle = "rgba(0,0,0,.35)"; rrect(g, o.x + 3, o.y + 5, o.w, o.h, 3); g.fill();
      const gr = g.createLinearGradient(o.x, o.y, o.x + o.w, o.y + o.h);
      gr.addColorStop(0, "rgba(200,252,255,.96)"); gr.addColorStop(.5, "rgba(90,200,235,.88)"); gr.addColorStop(1, "rgba(205,246,255,.96)");
      rrect(g, o.x, o.y, o.w, o.h, 3); g.fillStyle = gr; g.fill();
      g.save(); rrect(g, o.x, o.y, o.w, o.h, 3); g.clip();
      g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = 2;
      const ph = ((Date.now() / 60) % 24);
      for (let k = -o.h; k < o.w + o.h; k += 24) {
        g.beginPath(); g.moveTo(o.x + k + ph, o.y + o.h); g.lineTo(o.x + k + ph + o.h, o.y); g.stroke();
      }
      g.restore();
      g.shadowColor = "#00e5ff"; g.shadowBlur = 10; g.strokeStyle = "#7df3ff"; g.lineWidth = 2;
      rrect(g, o.x, o.y, o.w, o.h, 3); g.stroke();
      g.restore();
    }

    const WARP_COL = ["#b388ff", "#ffb347", "#5dffb0"];
    function drawWarps(g, list, t) {
      list.forEach((w, i) => {
        const c = WARP_COL[w.pair % WARP_COL.length];
        g.save(); g.translate(w.x, w.y);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, WARP_R + 10);
        gr.addColorStop(0, "rgba(5,5,20,.95)"); gr.addColorStop(.65, "rgba(5,5,20,.7)"); gr.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, WARP_R + 10, 0, TAU); g.fill();
        g.shadowColor = c; g.shadowBlur = 14; g.strokeStyle = c; g.lineWidth = 3;
        g.beginPath(); g.arc(0, 0, WARP_R - 1, 0, TAU); g.stroke();
        g.shadowBlur = 0; g.lineWidth = 2.2; g.lineCap = "round";
        for (let k = 0; k < 3; k++) {
          const a = t * 2.2 * (i % 2 ? -1 : 1) + k * TAU / 3;
          g.beginPath(); g.arc(0, 0, WARP_R - 8, a, a + 1.3); g.stroke();
        }
        g.fillStyle = c; g.beginPath(); g.arc(0, 0, 4 + Math.sin(t * 4) * 1.2, 0, TAU); g.fill();
        g.restore();
      });
    }

    function drawPads(g, list, now) {
      list.forEach(p => {
        const ready = now >= p.next;
        g.save(); g.translate(p.x, p.y);
        g.shadowColor = ready ? "#5dff9b" : "transparent"; g.shadowBlur = ready ? 14 : 0;
        g.fillStyle = ready ? "rgba(30,120,70,.78)" : "rgba(40,48,60,.72)";
        g.beginPath(); g.arc(0, 0, PAD_R, 0, TAU); g.fill();
        g.lineWidth = 3; g.strokeStyle = ready ? "#5dff9b" : "#6a7388"; g.stroke(); g.shadowBlur = 0;
        if (ready) {
          const s = 1 + Math.sin(now / 260) * .06;
          g.fillStyle = "#eafff2"; g.fillRect(-3 * s, -9 * s, 6 * s, 18 * s); g.fillRect(-9 * s, -3 * s, 18 * s, 6 * s);
        } else {
          const f = Math.max(0, Math.min(1, (p.next - now) / PAD_RESPAWN));
          g.strokeStyle = "#9fb0cc"; g.lineWidth = 3;
          g.beginPath(); g.arc(0, 0, PAD_R - 6, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - f)); g.stroke();
        }
        g.restore();
      });
    }

    function drawGimmickPreview(g, mapName) {
      const gm = getGimmicksForMap(mapName);
      drawWarps(g, gm.warps, .6);
      drawPads(g, gm.pads.map(p => ({ x: p.x, y: p.y, next: 0 })), Date.now());
    }

    function drawObstacle(g, o, th) {
      if (o.brk) return drawBreakable(g, o);
      if (o.mir) return drawMirror(g, o);
      const s = th.obs, cx = o.x + o.w / 2, cy = o.y + o.h / 2;
      g.save();
      g.fillStyle = "rgba(0,0,0,.38)";
      if (s.style === "tree" || s.style === "rock") { g.beginPath(); g.ellipse(cx + 3, cy + 6, o.w * .55, o.h * .5, 0, 0, TAU); g.fill(); }
      else { rrect(g, o.x + 4, o.y + 6, o.w, o.h, 3); g.fill(); }

      if (s.style === "tree") {
        const R = Math.max(o.w, o.h) / 2 * 1.08;
        const gr = g.createRadialGradient(cx - R * .3, cy - R * .35, R * .1, cx, cy, R);
        gr.addColorStop(0, "#5ccb74"); gr.addColorStop(.6, "#2f8a4a"); gr.addColorStop(1, "#1a5430");
        g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
        g.strokeStyle = s.edge; g.lineWidth = 1.5; g.stroke();
        g.fillStyle = "rgba(255,255,255,.14)"; g.beginPath(); g.ellipse(cx - R * .3, cy - R * .35, R * .38, R * .22, -.5, 0, TAU); g.fill();
        g.restore(); return;
      }
      if (s.style === "rock") {
        const R = Math.max(o.w, o.h) / 2;
        const gr = g.createRadialGradient(cx - R * .3, cy - R * .3, R * .1, cx, cy, R * 1.1);
        gr.addColorStop(0, "#b5bad0"); gr.addColorStop(1, "#4a4e66");
        g.fillStyle = gr; rrect(g, o.x, o.y, o.w, o.h, Math.min(o.w, o.h) * .45); g.fill();
        g.strokeStyle = s.edge; g.lineWidth = 1.5; g.stroke();
        g.fillStyle = "rgba(0,0,0,.22)";
        const k = hashPos(o, 3);
        g.beginPath(); g.arc(cx + (k - 1) * R * .3, cy + R * .15, R * .22, 0, TAU); g.fill();
        g.beginPath(); g.arc(cx - R * .25, cy - R * .2, R * .13, 0, TAU); g.fill();
        g.restore(); return;
      }

      const D = Math.min(7, o.h * .35), topH = o.h - D;
      const rad = s.style === "dune" ? 9 : s.style === "ice" ? 4 : 2;
      let pal = { top: s.top, side: s.side };
      if (s.style === "container") pal = CONTAINER_PAL[hashPos(o, 3)];
      rrect(g, o.x, o.y, o.w, o.h, rad); g.fillStyle = pal.side; g.fill();
      rrect(g, o.x, o.y, o.w, topH, rad); g.fillStyle = pal.top; g.fill();
      const og = g.createLinearGradient(0, o.y, 0, o.y + topH);
      og.addColorStop(0, "rgba(255,255,255,.22)"); og.addColorStop(1, "rgba(0,0,0,.14)");
      g.fillStyle = og; g.fill();

      g.save(); rrect(g, o.x, o.y, o.w, topH, rad); g.clip();
      if (s.style === "building") {
        for (let x = o.x + 6; x < o.x + o.w - 6; x += 12) for (let y = o.y + 6; y < o.y + topH - 6; y += 12) {
          const lit = (hashPos({ x: x, y: y, w: 1, h: 1 }, 5)) < 2;
          g.fillStyle = lit ? "rgba(255,220,120,.85)" : "rgba(20,24,40,.6)"; g.fillRect(x, y, 6, 6);
        }
      } else if (s.style === "container") {
        g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 2;

        else for (let y = o.y + 8; y < o.y + topH; y += 9) { g.beginPath(); g.moveTo(o.x, y); g.lineTo(o.x + o.w, y); g.stroke(); }
      } else if (s.style === "ice") {
        g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 2;

      } else if (s.style === "stone" || s.style === "basalt") {
        g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 1;
        for (let i = 0; i < 4; i++) { const k = hashPos({ x: o.x + i * 13, y: o.y, w: o.w, h: o.h }, 100) / 100; g.beginPath(); g.moveTo(o.x + k * o.w, o.y); g.lineTo(o.x + (1 - k) * o.w, o.y + topH); g.stroke(); }
      } else if (s.style === "dune") {

      }

      g.lineWidth = 1.5;

    function drawMapPreview(cv, mapName) {

    /* ---------- 画像キャッシュ ---------- */
    const imgCache = {};

    /* ---------- 画面エフェクト用の状態（見た目専用） ---------- */
    const fx = { p1: null, p2: null, hp: [100, 100], flash: [0, 0], floaters: [], shake: 0 };
    function fxSync() {
      if (fx.p1 !== player1 || fx.p2 !== player2) {
        fx.p1 = player1; fx.p2 = player2; fx.hp = [player1.hp, player2.hp]; fx.flash = [0, 0]; fx.floaters = []; fx.shake = 0;

    }
    function bulletOwner(b) { return b.own || (b.from === player1 ? 1 : 2); }
    function isSkillReady(p, now) {

    /* ---------- 描画 ---------- */

        ctx.fillStyle = "rgba(190,20,50,.32)"; ctx.fill("evenodd");
        ctx.lineWidth = 3; ctx.strokeStyle = "rgba(120,255,170,.95)"; ctx.shadowColor = "#4dff9a"; ctx.shadowBlur = 14;
        ctx.setLineDash([14, 8]); ctx.lineDashOffset = -t * 20;

    }

    function drawTurret(t) {
      const idx = t.own || (t.owner === player1 ? 1 : 2), T = TEAM[idx], foe = idx === 1 ? player2 : player1;
      const tp = window.turretAimPoint ? window.turretAimPoint(t) : null;   // ver28：召喚物ペットも狙う
      const ang = tp ? Math.atan2(tp.y - t.y, tp.x - t.x) : Math.atan2(foe.y + foe.h / 2 - t.y, foe.x + foe.w / 2 - t.x);
      ctx.save(); ctx.translate(t.x, t.y);
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(2, 6, 11, 5, 0, 0, TAU); ctx.fill();
      ctx.shadowColor = T.main; ctx.shadowBlur = 10; ctx.fillStyle = "#171d33"; ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0; ctx.lineWidth = 2.5; ctx.strokeStyle = T.main; ctx.stroke();
      ctx.rotate(ang); ctx.fillStyle = T.light; ctx.fillRect(2, -2.5, 13, 5);
      ctx.restore();
    }

    function drawPlayer(p) {
      const idx = p === player1 ? 1 : 2, T = TEAM[idx], foe = idx === 1 ? player2 : player1;
      const cx = p.x + p.w / 2, cy = p.y + p.h / 2, R = 19, now = Date.now();
      const ready = isSkillReady(p, now), flash = fx.flash[idx - 1];
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(cx, cy + 16, 16, 6, 0, 0, TAU); ctx.fill();
      if (ready) {
        ctx.strokeStyle = `rgba(255,214,64,${(.45 + .35 * Math.sin(now / 180)).toFixed(2)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, R + 5, 0, TAU); ctx.stroke();
      }
      ctx.save(); ctx.shadowColor = T.main; ctx.shadowBlur = 14; ctx.fillStyle = "#0b1226";
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill(); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R - 2, 0, TAU); ctx.clip();
      const img = getCharImg(p.charName);
      if (img) {
        const s = Math.max((2 * (R - 2)) / img.naturalWidth, (2 * (R - 2)) / img.naturalHeight);
        const w = img.naturalWidth * s, h = img.naturalHeight * s; ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
      } else {
        const gr = ctx.createLinearGradient(cx, cy - R, cx, cy + R); gr.addColorStop(0, T.main); gr.addColorStop(1, "#0b1226");
        ctx.fillStyle = gr; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
        ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(p.charName.charAt(0), cx, cy + 1);
      }
      if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${(flash * .7).toFixed(2)})`; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R); }
      ctx.restore();
      fx.flash[idx - 1] = Math.max(0, flash - .08);
      ctx.lineWidth = 3; ctx.strokeStyle = T.main; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
      // 照準の向き（相手方向）
      const aT = window.aimTarget ? window.aimTarget(p, foe) : foe;   // ver28：召喚物ペットが近ければそちらを向く
      const a = Math.atan2(aT.y + aT.h / 2 - cy, aT.x + aT.w / 2 - cx);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(a); ctx.fillStyle = T.light;
      ctx.beginPath(); ctx.moveTo(R + 9, 0); ctx.lineTo(R + 2, -4); ctx.lineTo(R + 2, 4); ctx.closePath(); ctx.fill(); ctx.restore();
      // HP・弾数バー
      const bw = 38, bx = cx - bw / 2, by = p.y - 16, ratio = Math.max(0, Math.min(1, p.hp / 100));
      ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(bx - 1, by - 1, bw + 2, 7);
      ctx.fillStyle = ratio > .5 ? "#4dff9b" : ratio > .25 ? "#ffc53d" : "#ff4d5e"; ctx.fillRect(bx, by, bw * ratio, 5);
      if (p.maxAmmo <= 12) {
        const n = p.maxAmmo, gap = 2, pw = (bw - (n - 1) * gap) / n;
        for (let i = 0; i < n; i++) { ctx.fillStyle = i < p.ammo ? "#7df3ff" : "rgba(255,255,255,.2)"; ctx.fillRect(bx + i * (pw + gap), by + 8, pw, 3); }
      }
      if (p.charName === "ツインブラザーズ" && p.mode) {
        ctx.fillStyle = "#ffd23f"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillText(p.mode, bx + bw + 4, by + 6);
      }
    }

    function drawBullets() {
      bullets.forEach(b => {
        const T = TEAM[bulletOwner(b)], sp = Math.hypot(b.vx, b.vy);
        if (sp > .1) {
          const len = Math.min(36, sp * 4), ux = b.vx / sp, uy = b.vy / sp;
          const gr = ctx.createLinearGradient(b.x - ux * len, b.y - uy * len, b.x, b.y);
          gr.addColorStop(0, `rgba(${T.rgb},0)`); gr.addColorStop(1, `rgba(${T.rgb},.7)`);
          ctx.strokeStyle = gr; ctx.lineWidth = Math.max(2, b.r * 1.4); ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(b.x - ux * len, b.y - uy * len); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
        const gg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 3);
        gg.addColorStop(0, `rgba(${T.rgb},.55)`); gg.addColorStop(1, `rgba(${T.rgb},0)`);
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 3, 0, TAU); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(1.5, b.r * .75), 0, TAU); ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = T.main; ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(2, b.r), 0, TAU); ctx.stroke();
      });
      ctx.lineCap = "butt";
    }

    function drawExplosions() {
      explosions.forEach(e => {
        const p = 1 - e.life / 15, a = Math.max(0, 1 - p);
        const gr = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
        gr.addColorStop(0, `rgba(255,255,220,${(.85 * a).toFixed(2)})`); gr.addColorStop(.5, `rgba(255,150,50,${(.55 * a).toFixed(2)})`); gr.addColorStop(1, "rgba(255,60,20,0)");
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.fill();
        ctx.strokeStyle = `rgba(255,200,120,${a.toFixed(2)})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (.55 + .45 * p), 0, TAU); ctx.stroke();
        ctx.lineWidth = 2;
        for (let i = 0; i < 10; i++) {
          const ang = i * TAU / 10 + .3, r1 = e.r * (.3 + .7 * p), r2 = r1 + e.r * .25;
          ctx.beginPath(); ctx.moveTo(e.x + Math.cos(ang) * r1, e.y + Math.sin(ang) * r1); ctx.lineTo(e.x + Math.cos(ang) * r2, e.y + Math.sin(ang) * r2); ctx.stroke();
        }
      });
    }

    function draw() {
      fxSync();
      const W = canvas.width, H = canvas.height, th = MAP_THEME[selectedMap] || MAP_THEME["草原"];
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
      ctx.save();

      ctx.drawImage(getBg(selectedMap), 0, 0);

      obstacles.forEach(o => drawObstacle(ctx, o, th));

      drawPlayer(player1); drawPlayer(player2);
      drawBullets(); drawExplosions();
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.font = "bold 15px sans-serif"; ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.8)";

        ctx.font = "italic 900 72px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineWidth = 6; ctx.strokeStyle = "#000";
        ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 24; ctx.strokeText("FIGHT!", 0, 0); ctx.fillStyle = "#fff"; ctx.fillText("FIGHT!", 0, 0);
        ctx.restore();

      ctx.restore();

    /* ---------- HUD ---------- */
    const hudState = { p1: null, p2: null, mx: [-1, -1] };
    function hudSetPlayer(i, p) {
      $("hudName" + i).textContent = p.charName;
      const img = characterImages[p.charName];

        const heal = p.charName === "聖なる使者", ready = isSkillReady(p, now), key = skillKey(i);
        const sk = heal ? p.skillCharge / 30 : (ready ? 1 : (now - p.skillLastUsed) / p.skillCooldown);
        $("hudSk" + i).style.width = (Math.max(0, Math.min(1, sk)) * 100).toFixed(1) + "%";
        $("hudSkBox" + i).classList.toggle("ready", ready);

                                              : (ready ? "READY" + (key ? " [" + key + "]" : "") : "SKILL");

    }

    /* ---------- YOU マーカー（オンライン） ---------- */

    /* ============================================================
       キャラ選択
       ============================================================ */
    let csActive = 1, _allStats = null;
    function relRows(name) {
      if (!_allStats) _allStats = CHAR_NAMES.map(charStats);
      const all = _allStats, st = charStats(name);
      const maxSpeed = Math.max(...all.map(s => s.speed)), maxPower = Math.max(...all.map(s => s.power));
      const maxAmmo = Math.max(...all.map(s => s.ammo).filter(a => a < 100));
      const maxRate = Math.max(...all.map(s => 1 / s.reload));
      const maxSkill = Math.max(...all.filter(s => isFinite(s.skillCt) && s.skillCt >= 2).map(s => 1 / s.skillCt));
      const pct = v => Math.max(4, Math.min(100, Math.round(v * 100)));
      return [
        ["速度", pct(st.speed / maxSpeed), st.speed.toFixed(1)],
        ["攻撃", pct(st.power / maxPower), st.shots > 1 ? `${st.dmg}×${st.shots}` : `${st.dmg}`],
        ["装弾", st.ammo >= 100 ? 100 : pct(st.ammo / maxAmmo), st.ammo >= 100 ? "∞" : `${st.ammo}発`],
        ["装填", pct((1 / st.reload) / maxRate), `${st.reload.toFixed(1)}秒`],
        ["技", isFinite(st.skillCt) ? pct((1 / st.skillCt) / maxSkill) : 4, isFinite(st.skillCt) ? `${st.skillCt}秒` : "溜め式"]
