          const h = Array.from({ length: 8 }, (_, i) => `<span style="display:inline-block;width:10px;height:10px;margin:0 1px;border-radius:50%;background:${i < n ? COL[p.pets[i]] : "rgba(255,255,255,.15)"};${i === n - 1 ? "box-shadow:0 0 0 2px #fff;transform:scale(1.25)" : ""}"></span>`).join("");
          if (pips.dataset.pt !== h) { pips.dataset.pt = h; pips.className = "pips"; pips.innerHTML = h; }
        });
      };
      const near = (s, t) => { // 最も近い敵プレイヤー／召喚物（ペット・タレット）を狙う
        const e = foe(s); if (t !== e) return t;
        const cx = s.x + 15, cy = s.y + 15; let best = t, bd = Math.hypot(e.x + 15 - cx, e.y + 15 - cy);
        const chk = (x, y, o) => { const d = Math.hypot(x - cx, y - cy); if (d < bd) { bd = d; best = o || { x: x - 15, y: y - 15, w: 30, h: 30 }; } };
        mins.forEach(m => { if (m.o !== s) chk(m.x + 10, m.y + 10, petProxy(m)); });
        turrets.forEach(u => { if (u.owner !== s) chk(u.x, u.y); });
        return best;
      };
      window.aimTarget = near;   // エイム矢印・魔法陣・演出が、実際に撃つ相手（ペット含む）を向くように
      const _sb2 = shootBullet;
      shootBullet = function (s, t) { return _sb2(s, near(s, t)); };
      const turretTarget = u => { // タレットが狙う点：最も近い敵プレイヤー／召喚物ペット
        const o = u.owner || (u.own === 1 ? player1 : player2), e = foe(o); let tx = e.x + 15, ty = e.y + 15, bd = Math.hypot(tx - u.x, ty - u.y);
        mins.forEach(m => { if (m.o === o) return; const d = Math.hypot(m.x + 10 - u.x, m.y + 10 - u.y); if (d < bd) { bd = d; tx = m.x + 10; ty = m.y + 10; } });
        return { x: tx, y: ty };
      };
      window.turretAimPoint = turretTarget;
      turretShoot = function (u) {
        if (!gameActive) return;
        const q = turretTarget(u), tx = q.x, ty = q.y;
        const dx = tx - u.x, dy = ty - u.y, mag = Math.hypot(dx, dy) || 1;
        bullets.push({ x: u.x, y: u.y, r: 5, vx: dx / mag * 6, vy: dy / mag * 6, from: u.owner, damage: 5, lifeTime: 0, maxLifeTime: 1000, hasReflected: false });
      };
      const _bs = buildSnap;
      buildSnap = function () {
        const s = _bs();
        s.pt = [player1, player2].map(p => p.pets || null);
        s.mn = mins.map(m => [Math.round(m.x), Math.round(m.y), m.t, m.hp, m.o === player1 ? 1 : 2]);
        return s;
      };
      const _as = applySnap;
      applySnap = function (s) {
        _as(s);
        if (s.pt) [player1, player2].forEach((p, i) => { if (s.pt[i]) { p.pets = s.pt[i]; p.ammo = p.pets.length; } });
        if (s.mn) { mins.length = 0; s.mn.forEach(a => mins.push({ x: a[0], y: a[1], t: a[2], hp: a[3], o: a[4] === 1 ? player1 : player2 })); }
      };
    })();
  
    /* ver28：アクアファイターの壁で敵または自分が埋まった時だけ、次のスキルが使えるようになった時点で壁を撤去 */
    (function () {
      const _up = update;
      update = function () {
        _up();
        const t = Date.now(), ov = (p, o) => p.x < o.x + o.w && p.x + p.w > o.x && p.y < o.y + o.h && p.y + p.h > o.y;
        [player1, player2].forEach(a => {
          if (!a || a.charName !== "アクアファイター" || t - a.skillLastUsed < a.skillCooldown) return;
          const e = a === player1 ? player2 : player1;
          for (let i = obstacles.length - 1; i >= 0; i--) { const o = obstacles[i]; if (o.aq === a && (ov(a, o) || ov(e, o))) obstacles.splice(i, 1); }

    })();

  <script>
    function Account_open(tab) {

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, where, onSnapshot, writeBatch, runTransaction } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXg27T4ZNPS3KzdIfFQpPOBcJSHT4Vgtc",
      authDomain: "dshooting-login.firebaseapp.com",
      projectId: "dshooting-login",
      storageBucket: "dshooting-login.firebasestorage.app",
      messagingSenderId: "179617344446",
      appId: "1:179617344446:web:7a302d677a72eefa35e7ef"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app); auth.languageCode = "ja";
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let user = null, profile = null, state = "guest", friends = [], reqs = [], unsubs = [], sent = new Set(), curInv = null;
    const myName = () => (profile && profile.name) || "ゲスト";
    const inRoomAsHost = () => { try { return !!(onl && onl.code && onl.isHost); } catch (e) { return false; } };

    const ERR = {
      "auth/invalid-credential": "メールアドレスかパスワードが違います。",
      "auth/wrong-password": "メールアドレスかパスワードが違います。",
      "auth/user-not-found": "メールアドレスかパスワードが違います。",
      "auth/email-already-in-use": "このメールアドレスはすでに登録されています。ログインしてください。",
      "auth/weak-password": "パスワードは6文字以上にしてください。",
      "auth/invalid-email": "メールアドレスの形式が正しくありません。",
      "auth/too-many-requests": "試行回数が多すぎます。しばらく待ってからもう一度お試しください。",
      "auth/network-request-failed": "通信に失敗しました。接続を確認してください。",
      "auth/unauthorized-domain": "このサイトのドメインがFirebaseの承認済みドメインに登録されていません。",
      "permission-denied": "権限がありません（Firestoreのルールを確認してください）。"
    };
    const errText = e => ERR[e.code] || ("エラー：" + (e.code || e.message));
    const setMsg = t => { const m = $("accMsg"); if (m) m.textContent = t || ""; };

    /* ---------- ヘッダーの表示 ---------- */
    function setChip() {
      const n = $("accName"), b = $("accBtn"), g = $("accBadge");
      if (n) n.textContent = myName();
      if (b) b.textContent = state === "user" ? "アカウント" : "ログイン";
      if (g) { g.textContent = reqs.length; g.style.display = reqs.length ? "inline-block" : "none"; }
    }

    /* ---------- プロフィール（フレンドコード付き） ---------- */
    const CH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const genCode = () => Array.from({ length: 6 }, () => CH[Math.floor(Math.random() * CH.length)]).join("");
    async function ensureProfile(u) {
      const ref = doc(db, "users", u.uid), snap = await getDoc(ref);
      if (snap.exists()) return snap.data();
      const name = String(u.displayName || (u.email || "").split("@")[0] || "プレイヤー").slice(0, 16);
      for (let i = 0; i < 8; i++) {
        const code = genCode(), cref = doc(db, "codes", code);
        try {
          await runTransaction(db, async tx => {
            if ((await tx.get(cref)).exists()) throw new Error("dup");
            tx.set(cref, { uid: u.uid });
            tx.set(ref, { name, code, createdAt: Date.now() });
          });
          return { name, code, createdAt: Date.now() };
        } catch (e) { if (e.message !== "dup") throw e; }
      }
      throw new Error("フレンドコードを作れませんでした");
    }

    /* ---------- ログイン状態の切り替え ---------- */
    function detach() { unsubs.forEach(f => { try { f(); } catch (e) {} }); unsubs = []; }
    async function handleUser(u) {
      detach(); user = u; profile = null; friends = []; reqs = [];
      if (!u) { state = "guest"; setChip(); build(); return; }
      const pw = u.providerData.some(p => p.providerId === "password") && !u.providerData.some(p => p.providerId === "google.com");
      if (pw && !u.emailVerified) { state = "verify"; setChip(); build(); return; }
      state = "loading"; build();
      try { profile = await ensureProfile(u); }
      catch (e) { state = "error"; build(); setMsg("プロフィールの読み込みに失敗しました（" + (e.code || e.message) + "）"); return; }
      state = "user"; setChip(); attach(); build();
    }
    onAuthStateChanged(auth, handleUser);

    function attach() {
      const uid = user.uid;
      unsubs.push(onSnapshot(collection(db, "users", uid, "friends"), s => {
        friends = s.docs.map(d => ({ uid: d.id, name: d.data().name || "?" })).sort((a, b) => a.name.localeCompare(b.name));
        renderLists();
      }, e => console.warn(e)));
      unsubs.push(onSnapshot(query(collection(db, "friendRequests"), where("to", "==", uid)), s => {
        reqs = s.docs.map(d => ({ id: d.id, ...d.data() })); setChip(); renderLists();
      }, e => console.warn(e)));
      unsubs.push(onSnapshot(query(collection(db, "invites"), where("to", "==", uid)), s => {
        s.docChanges().forEach(ch => {
          if (ch.type === "removed") { if (curInv && curInv.id === ch.doc.id) hideToast(); return; }
          const d = ch.doc.data();
          if (Date.now() - d.at > 180000) { deleteDoc(ch.doc.ref).catch(() => {}); return; }
          showToast(ch.doc.id, d);
        });
      }, e => console.warn(e)));
    }

    /* ---------- 招待の通知 ---------- */
    function showToast(id, d) {
      curInv = { id, ...d };
      const t = $("inviteToast");
      t.innerHTML = "<div>🎮 <b>" + esc(d.fromName || "フレンド") + "</b> さんから対戦の招待が届きました</div><button id=\"invOk\">参加する</button><button id=\"invNo\">無視</button>";
      t.style.display = "block";
      $("invOk").onclick = () => joinInvite();
      $("invNo").onclick = () => { deleteDoc(doc(db, "invites", id)).catch(() => {}); hideToast(); };
    }
    function hideToast() { curInv = null; $("inviteToast").style.display = "none"; }
    function joinInvite() {
      const inv = curInv; if (!inv) return;
      deleteDoc(doc(db, "invites", inv.id)).catch(() => {});
      hideToast(); closeModal();
      try { cpuMode = false; } catch (e) {}
      showOnlineMenu();
      $("roomCodeInput").value = inv.code;
      onlineJoinRoom();
    }

    /* ---------- モーダルUI ---------- */
    function openModal() { $("accModal").classList.add("on"); build(); }
    function closeModal() { $("accModal").classList.remove("on"); }
    function head(t) { return '<button id="accClose" data-act="close">✕ 閉じる</button><h2>' + t + "</h2>"; }
    function build() {
      const p = $("accPanel"); if (!p) return;
      if (state === "guest") {
        p.innerHTML = head("👤 ログイン") +
          '<div class="dim">ログインしなくても、今までどおり遊べます（名前は「ゲスト」）。ログインするとフレンド登録と招待が使えます。</div>' +
          '<h3>Googleアカウント</h3><button data-act="google">Googleでログイン</button>' +
          '<h3>メールアドレス</h3>' +
          '<input type="text" id="accDisp" placeholder="表示名（新規登録時・16文字まで）" maxlength="16">' +
          '<input type="email" id="accEmail" placeholder="メールアドレス" autocomplete="email">' +
          '<input type="password" id="accPass" placeholder="パスワード（6文字以上）" autocomplete="current-password">' +
          '<button data-act="login">ログイン</button><button data-act="signup">新規登録</button><button data-act="reset">パスワードを忘れた</button>' +
          '<div id="accMsg"></div>';
      } else if (state === "verify") {
        p.innerHTML = head("✉ メールの確認") +
          "<div>" + esc(user.email) + " に確認メールを送りました。メール内のリンクを開いたあと、下の「確認しました」を押してください。</div>" +
          '<div class="dim">届かないときは迷惑メールフォルダも確認してください。</div>' +
          '<button data-act="verified">確認しました</button><button data-act="resend">メールを再送</button><button data-act="logout">ログアウト</button><div id="accMsg"></div>';
      } else if (state === "loading") {
        p.innerHTML = head("👤 アカウント") + "<div>読み込み中…</div>";
      } else if (state === "error") {
        p.innerHTML = head("👤 アカウント") + '<div id="accMsg"></div><button data-act="logout">ログアウト</button>';
      } else {
        p.innerHTML = head("👤 " + esc(profile.name)) +
          '<h3>表示名</h3><input type="text" id="accEditName" maxlength="16" value="' + esc(profile.name) + '"><button data-act="saveName">変更</button>' +
          '<h3>あなたのフレンドコード</h3><div><span class="code">' + esc(profile.code) + '</span> <button data-act="copyCode">コピー</button></div>' +
          '<div class="dim">このコードを友達に教えると、フレンド申請してもらえます。</div>' +
          '<h3>フレンドを追加</h3><input type="text" id="accAddCode" maxlength="6" placeholder="相手のフレンドコード" style="text-transform:uppercase"><button data-act="addFriend">申請を送る</button>' +
          '<div id="accReqsBox"></div><h3>フレンド</h3><div id="accFriends"></div>' +
          '<div id="accMsg"></div><button data-act="logout" style="margin-top:14px">ログアウト</button>';
        renderLists();
      }
    }
    function renderLists() {
      const rb = $("accReqsBox"), fb = $("accFriends");
      if (rb) rb.innerHTML = reqs.length ? "<h3>届いている申請</h3>" + reqs.map(r => '<div class="row"><span class="n">' + esc(r.fromName || "?") + '</span><span><button data-act="accept" data-id="' + esc(r.id) + '">承認</button><button data-act="decline" data-id="' + esc(r.id) + '">拒否</button></span></div>').join("") : "";
      if (fb) {
        const host = inRoomAsHost();
        fb.innerHTML = friends.length ? friends.map(f => '<div class="row"><span class="n">' + esc(f.name) + '</span><span>' + (host ? '<button data-act="inv" data-id="' + esc(f.uid) + '">招待</button>' : "") + '<button data-act="del" data-id="' + esc(f.uid) + '">削除</button></span></div>').join("") : '<div class="dim">まだフレンドがいません。</div>' +
          "";
        if (!host && friends.length) fb.insertAdjacentHTML("beforeend", '<div class="dim" style="margin-top:6px">招待するには、オンライン対戦で「ルームを作成」してロビーを開いてください。</div>');
      }
    }

    /* ---------- 操作 ---------- */
    async function act(a, el) {
      try {
        if (a === "close") return closeModal();
        if (a === "google") {
          const pr = new GoogleAuthProvider();
          try { await signInWithPopup(auth, pr); }
          catch (e) {
            if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") await signInWithRedirect(auth, pr);
            else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") setMsg(errText(e));
          }
          return;
        }
        if (a === "login") { await signInWithEmailAndPassword(auth, $("accEmail").value.trim(), $("accPass").value); return; }
        if (a === "signup") {
          const c = await createUserWithEmailAndPassword(auth, $("accEmail").value.trim(), $("accPass").value);
          const dn = ($("accDisp").value || "").trim().slice(0, 16);
          if (dn) await updateProfile(c.user, { displayName: dn });
          await sendEmailVerification(c.user);
          return;
        }
        if (a === "reset") {
          const m = $("accEmail").value.trim(); if (!m) return setMsg("メールアドレスを入力してください。");
          await sendPasswordResetEmail(auth, m); return setMsg("パスワード再設定のメールを送りました。");
        }
        if (a === "resend") { await sendEmailVerification(auth.currentUser); return setMsg("確認メールを再送しました。"); }
        if (a === "verified") {
          await auth.currentUser.reload(); await auth.currentUser.getIdToken(true);
          if (auth.currentUser.emailVerified) return handleUser(auth.currentUser);
          return setMsg("まだ確認できていません。メールのリンクを開いてください。");
        }
        if (a === "logout") { await signOut(auth); return; }
        if (a === "copyCode") { try { await navigator.clipboard.writeText(profile.code); setMsg("コピーしました。"); } catch (e) { setMsg("コード：" + profile.code); } return; }
        if (a === "saveName") {
          const n = ($("accEditName").value || "").trim().slice(0, 16); if (!n) return setMsg("名前を入力してください。");
          await updateDoc(doc(db, "users", user.uid), { name: n });
          const b = writeBatch(db); friends.forEach(f => b.update(doc(db, "users", f.uid, "friends", user.uid), { name: n }));
          if (friends.length) await b.commit().catch(() => {});
          profile.name = n; setChip(); build(); return setMsg("名前を変更しました。");
        }
        if (a === "addFriend") {
          const code = ($("accAddCode").value || "").toUpperCase().trim(); if (code.length !== 6) return setMsg("6文字のフレンドコードを入力してください。");
          const c = await getDoc(doc(db, "codes", code)); if (!c.exists()) return setMsg("そのコードは見つかりません。");
          const to = c.data().uid; if (to === user.uid) return setMsg("自分自身には申請できません。");
          if (friends.some(f => f.uid === to)) return setMsg("すでにフレンドです。");
          await setDoc(doc(db, "friendRequests", user.uid + "_" + to), { from: user.uid, to, fromName: myName(), at: Date.now() });
          $("accAddCode").value = ""; return setMsg("フレンド申請を送りました。");
        }
        if (a === "accept") {
          const r = reqs.find(x => x.id === el.dataset.id); if (!r) return;
          const b = writeBatch(db);
          b.set(doc(db, "users", user.uid, "friends", r.from), { name: r.fromName || "?" });
          b.set(doc(db, "users", r.from, "friends", user.uid), { name: myName() });
          b.delete(doc(db, "friendRequests", r.id));
          await b.commit(); return setMsg((r.fromName || "") + " さんとフレンドになりました。");
        }
        if (a === "decline") { await deleteDoc(doc(db, "friendRequests", el.dataset.id)); return; }
        if (a === "del") {
          const f = friends.find(x => x.uid === el.dataset.id); if (!f || !confirm(f.name + " さんをフレンドから削除しますか？")) return;
          const b = writeBatch(db); b.delete(doc(db, "users", user.uid, "friends", f.uid)); b.delete(doc(db, "users", f.uid, "friends", user.uid)); await b.commit(); return;
        }
        if (a === "inv") {
          if (!inRoomAsHost()) return setMsg("先にルームを作成してください。");
          const id = user.uid + "_" + el.dataset.id;
          await setDoc(doc(db, "invites", id), { from: user.uid, to: el.dataset.id, fromName: myName(), code: onl.code, mode: "1v1", slots: 2, at: Date.now() });
          sent.add(id); return setMsg("招待を送りました。");
        }
      } catch (e) { console.warn(e); setMsg(errText(e)); }
    }
    $("accPanel").addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b) act(b.dataset.act, b); });
    $("accModal").addEventListener("click", e => { if (e.target.id === "accModal") closeModal(); });

    window.Account = {
      open(tab) { openModal(); },
      name: myName,
      loggedIn: () => state === "user",
      dropInvites() { sent.forEach(id => deleteDoc(doc(db, "invites", id)).catch(() => {})); sent.clear(); }
    };
    setChip(); build();
  </script>
</body>
</html>
