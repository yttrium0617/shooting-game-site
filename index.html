      for (let k = -o.h; k < o.w + o.h; k += 24) {
        g.beginPath(); g.moveTo(o.x + k + ph, o.y + o.h); g.lineTo(o.x + k + ph + o.h, o.y); g.stroke();
      }
      g.restore();
      g.shadowColor = "#00e5ff"; g.shadowBlur = 10; g.strokeStyle = "#7df3ff"; g.lineWidth = 2;
      rrect(g, o.x, o.y, o.w, o.h, 3); g.stroke();
      g.restore();
    }

    const WARP_COL = ["#b388ff", "#ffb347", "#5dffb0"];
    function drawWarps(g, list, t) {
      list.forEach((w, i) => {
        const c = WARP_COL[w.pair % WARP_COL.length];
        g.save(); g.translate(w.x, w.y);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, WARP_R + 10);
        gr.addColorStop(0, "rgba(5,5,20,.95)"); gr.addColorStop(.65, "rgba(5,5,20,.7)"); gr.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, WARP_R + 10, 0, TAU); g.fill();
        g.shadowColor = c; g.shadowBlur = 14; g.strokeStyle = c; g.lineWidth = 3;
        g.beginPath(); g.arc(0, 0, WARP_R - 1, 0, TAU); g.stroke();
        g.shadowBlur = 0; g.lineWidth = 2.2; g.lineCap = "round";
        for (let k = 0; k < 3; k++) {
          const a = t * 2.2 * (i % 2 ? -1 : 1) + k * TAU / 3;
          g.beginPath(); g.arc(0, 0, WARP_R - 8, a, a + 1.3); g.stroke();
        }
        g.fillStyle = c; g.beginPath(); g.arc(0, 0, 4 + Math.sin(t * 4) * 1.2, 0, TAU); g.fill();
        g.restore();
      });
    }

    function drawPads(g, list, now) {
      list.forEach(p => {
        const ready = now >= p.next;
        g.save(); g.translate(p.x, p.y);
        g.shadowColor = ready ? "#5dff9b" : "transparent"; g.shadowBlur = ready ? 14 : 0;
        g.fillStyle = ready ? "rgba(30,120,70,.78)" : "rgba(40,48,60,.72)";
        g.beginPath(); g.arc(0, 0, PAD_R, 0, TAU); g.fill();
        g.lineWidth = 3; g.strokeStyle = ready ? "#5dff9b" : "#6a7388"; g.stroke(); g.shadowBlur = 0;
        if (ready) {
          const s = 1 + Math.sin(now / 260) * .06;
          g.fillStyle = "#eafff2"; g.fillRect(-3 * s, -9 * s, 6 * s, 18 * s); g.fillRect(-9 * s, -3 * s, 18 * s, 6 * s);
        } else {
          const f = Math.max(0, Math.min(1, (p.next - now) / PAD_RESPAWN));
          g.strokeStyle = "#9fb0cc"; g.lineWidth = 3;
          g.beginPath(); g.arc(0, 0, PAD_R - 6, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - f)); g.stroke();
        }
        g.restore();
      });
    }

    function drawGimmickPreview(g, mapName) {
      const gm = getGimmicksForMap(mapName);
      drawWarps(g, gm.warps, .6);
      drawPads(g, gm.pads.map(p => ({ x: p.x, y: p.y, next: 0 })), Date.now());
    }

    function drawObstacle(g, o, th) {
      if (o.brk) return drawBreakable(g, o);
      if (o.mir) return drawMirror(g, o);
      const s = th.obs, cx = o.x + o.w / 2, cy = o.y + o.h / 2;
      g.save();
      g.fillStyle = "rgba(0,0,0,.38)";
      if (s.style === "tree" || s.style === "rock") { g.beginPath(); g.ellipse(cx + 3, cy + 6, o.w * .55, o.h * .5, 0, 0, TAU); g.fill(); }
      else { rrect(g, o.x + 4, o.y + 6, o.w, o.h, 3); g.fill(); }

      if (s.style === "tree") {
        const R = Math.max(o.w, o.h) / 2 * 1.08;
        const gr = g.createRadialGradient(cx - R * .3, cy - R * .35, R * .1, cx, cy, R);
        gr.addColorStop(0, "#5ccb74"); gr.addColorStop(.6, "#2f8a4a"); gr.addColorStop(1, "#1a5430");
        g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
        g.strokeStyle = s.edge; g.lineWidth = 1.5; g.stroke();
        g.fillStyle = "rgba(255,255,255,.14)"; g.beginPath(); g.ellipse(cx - R * .3, cy - R * .35, R * .38, R * .22, -.5, 0, TAU); g.fill();
        g.restore(); return;
      }
      if (s.style === "rock") {
        const R = Math.max(o.w, o.h) / 2;
        const gr = g.createRadialGradient(cx - R * .3, cy - R * .3, R * .1, cx, cy, R * 1.1);
        gr.addColorStop(0, "#b5bad0"); gr.addColorStop(1, "#4a4e66");
        g.fillStyle = gr; rrect(g, o.x, o.y, o.w, o.h, Math.min(o.w, o.h) * .45); g.fill();
        g.strokeStyle = s.edge; g.lineWidth = 1.5; g.stroke();
        g.fillStyle = "rgba(0,0,0,.22)";
        const k = hashPos(o, 3);
        g.beginPath(); g.arc(cx + (k - 1) * R * .3, cy + R * .15, R * .22, 0, TAU); g.fill();
        g.beginPath(); g.arc(cx - R * .25, cy - R * .2, R * .13, 0, TAU); g.fill();
        g.restore(); return;
      }

      const D = Math.min(7, o.h * .35), topH = o.h - D;
      const rad = s.style === "dune" ? 9 : s.style === "ice" ? 4 : 2;
      let pal = { top: s.top, side: s.side };
      if (s.style === "container") pal = CONTAINER_PAL[hashPos(o, 3)];
      rrect(g, o.x, o.y, o.w, o.h, rad); g.fillStyle = pal.side; g.fill();
      rrect(g, o.x, o.y, o.w, topH, rad); g.fillStyle = pal.top; g.fill();
      const og = g.createLinearGradient(0, o.y, 0, o.y + topH);
      og.addColorStop(0, "rgba(255,255,255,.22)"); og.addColorStop(1, "rgba(0,0,0,.14)");
      g.fillStyle = og; g.fill();

      g.save(); rrect(g, o.x, o.y, o.w, topH, rad); g.clip();
      if (s.style === "building") {
        for (let x = o.x + 6; x < o.x + o.w - 6; x += 12) for (let y = o.y + 6; y < o.y + topH - 6; y += 12) {
          const lit = (hashPos({ x: x, y: y, w: 1, h: 1 }, 5)) < 2;
          g.fillStyle = lit ? "rgba(255,220,120,.85)" : "rgba(20,24,40,.6)"; g.fillRect(x, y, 6, 6);
        }
      } else if (s.style === "container") {
        g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 2;
        if (o.w >= o.h) for (let x = o.x + 8; x < o.x + o.w; x += 9) { g.beginPath(); g.moveTo(x, o.y); g.lineTo(x, o.y + topH); g.stroke(); }
        else for (let y = o.y + 8; y < o.y + topH; y += 9) { g.beginPath(); g.moveTo(o.x, y); g.lineTo(o.x + o.w, y); g.stroke(); }
      } else if (s.style === "ice") {
        g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 2;
        g.beginPath(); g.moveTo(o.x + 4, o.y + topH - 3); g.lineTo(o.x + o.w * .45, o.y + 3); g.stroke();
      } else if (s.style === "stone" || s.style === "basalt") {
        g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 1;
        for (let i = 0; i < 4; i++) { const k = hashPos({ x: o.x + i * 13, y: o.y, w: o.w, h: o.h }, 100) / 100; g.beginPath(); g.moveTo(o.x + k * o.w, o.y); g.lineTo(o.x + (1 - k) * o.w, o.y + topH); g.stroke(); }
      } else if (s.style === "dune") {
        g.strokeStyle = "rgba(120,90,40,.30)"; g.lineWidth = 1.5;
        for (let y = o.y + 5; y < o.y + topH; y += 6) { g.beginPath(); for (let x = o.x; x <= o.x + o.w; x += 4) { const yy = y + Math.sin(x / 7) * 1.4; x === o.x ? g.moveTo(x, yy) : g.lineTo(x, yy); } g.stroke(); }
      }
      g.restore();

      g.lineWidth = 1.5;
      if (s.style === "basalt") { g.strokeStyle = "rgba(255,106,42,.95)"; g.shadowColor = "#ff6a2a"; g.shadowBlur = 10; }
      else g.strokeStyle = s.edge;
      rrect(g, o.x, o.y, o.w, o.h, rad); g.stroke();
      g.restore();
    }

    function drawMapPreview(cv, mapName) {
      if (!cv) return;
      const g = cv.getContext("2d"), k = cv.width / ARENA_W, th = MAP_THEME[mapName] || MAP_THEME["草原"];
      g.clearRect(0, 0, cv.width, cv.height);
      g.save(); g.scale(k, k);
      g.drawImage(getBg(mapName), 0, 0);
      drawGimmickPreview(g, mapName);
      getObstaclesForMap(mapName).forEach(o => drawObstacle(g, o, th));
      g.font = "bold 22px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
      [[1, SPAWNS.p1], [2, SPAWNS.p2]].forEach(([i, s]) => {
        g.fillStyle = TEAM[i].main; g.fillText(i + "P", s.x + 15, s.y + 15);
      });
      g.restore();
    }

    /* ---------- 画像キャッシュ ---------- */
    const imgCache = {};
    function getCharImg(name) {
      if (!(name in imgCache)) {
        const im = new Image(); im._bad = false; im.onerror = () => { im._bad = true; };
        if (characterImages[name]) im.src = characterImages[name]; else im._bad = true;
        imgCache[name] = im;
      }
      const im = imgCache[name];
      return (im.complete && im.naturalWidth > 0 && !im._bad) ? im : null;
    }

    /* ---------- 画面エフェクト用の状態（見た目専用） ---------- */
    const fx = { p1: null, p2: null, hp: [100, 100], flash: [0, 0], floaters: [], shake: 0 };
    function fxSync() {
      if (fx.p1 !== player1 || fx.p2 !== player2) {
        fx.p1 = player1; fx.p2 = player2; fx.hp = [player1.hp, player2.hp]; fx.flash = [0, 0]; fx.floaters = []; fx.shake = 0;
      }
      [player1, player2].forEach((p, i) => {
        const d = p.hp - fx.hp[i];
        if (Math.abs(d) >= 1) {
          fx.floaters.push({ x: p.x + p.w / 2, y: p.y - 12, t: 0, txt: (d < 0 ? "-" : "+") + Math.round(Math.abs(d)), c: d < 0 ? "#ff5470" : "#5dff9b" });
          if (d < 0) { fx.flash[i] = 1; fx.shake = Math.min(8, Math.max(fx.shake, Math.abs(d) / 4)); }
        }
        fx.hp[i] = p.hp;
      });
    }
    function bulletOwner(b) { return b.own || (b.from === player1 ? 1 : 2); }
    function isSkillReady(p, now) {
      if (p.charName === "聖なる使者") return p.skillCharge >= 30;
      return now - p.skillLastUsed >= p.skillCooldown;
    }

    /* ---------- 描画 ---------- */
    function drawZone() {
      const W = canvas.width, H = canvas.height, t = performance.now() / 1000;
      if (safeZone.shrinking && safeZone.radius < Math.max(W, H)) {
        ctx.save();
        ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(safeZone.x, safeZone.y, Math.max(0, safeZone.radius), 0, TAU);
        ctx.fillStyle = "rgba(190,20,50,.32)"; ctx.fill("evenodd");
        ctx.lineWidth = 3; ctx.strokeStyle = "rgba(120,255,170,.95)"; ctx.shadowColor = "#4dff9a"; ctx.shadowBlur = 14;
        ctx.setLineDash([14, 8]); ctx.lineDashOffset = -t * 20;
        ctx.beginPath(); ctx.arc(safeZone.x, safeZone.y, Math.max(0, safeZone.radius), 0, TAU); ctx.stroke();
        ctx.restore();
      }
    }

    function drawTurret(t) {
      const idx = t.own || (t.owner === player1 ? 1 : 2), T = TEAM[idx], foe = idx === 1 ? player2 : player1;
      const ang = Math.atan2(foe.y + foe.h / 2 - t.y, foe.x + foe.w / 2 - t.x);
      ctx.save(); ctx.translate(t.x, t.y);
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(2, 6, 11, 5, 0, 0, TAU); ctx.fill();
      ctx.shadowColor = T.main; ctx.shadowBlur = 10; ctx.fillStyle = "#171d33"; ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0; ctx.lineWidth = 2.5; ctx.strokeStyle = T.main; ctx.stroke();
      ctx.rotate(ang); ctx.fillStyle = T.light; ctx.fillRect(2, -2.5, 13, 5);
      ctx.restore();
    }

    function drawPlayer(p) {
      const idx = p === player1 ? 1 : 2, T = TEAM[idx], foe = idx === 1 ? player2 : player1;
      const cx = p.x + p.w / 2, cy = p.y + p.h / 2, R = 19, now = Date.now();
      const ready = isSkillReady(p, now), flash = fx.flash[idx - 1];
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(cx, cy + 16, 16, 6, 0, 0, TAU); ctx.fill();
      if (ready) {
        ctx.strokeStyle = `rgba(255,214,64,${(.45 + .35 * Math.sin(now / 180)).toFixed(2)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, R + 5, 0, TAU); ctx.stroke();
      }
      ctx.save(); ctx.shadowColor = T.main; ctx.shadowBlur = 14; ctx.fillStyle = "#0b1226";
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill(); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R - 2, 0, TAU); ctx.clip();
      const img = getCharImg(p.charName);
      if (img) {
        const s = Math.max((2 * (R - 2)) / img.naturalWidth, (2 * (R - 2)) / img.naturalHeight);
        const w = img.naturalWidth * s, h = img.naturalHeight * s; ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
      } else {
        const gr = ctx.createLinearGradient(cx, cy - R, cx, cy + R); gr.addColorStop(0, T.main); gr.addColorStop(1, "#0b1226");
        ctx.fillStyle = gr; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
        ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(p.charName.charAt(0), cx, cy + 1);
      }
      if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${(flash * .7).toFixed(2)})`; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R); }
      ctx.restore();
      fx.flash[idx - 1] = Math.max(0, flash - .08);
      ctx.lineWidth = 3; ctx.strokeStyle = T.main; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
      // 照準の向き（相手方向）
      const a = Math.atan2(foe.y + foe.h / 2 - cy, foe.x + foe.w / 2 - cx);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(a); ctx.fillStyle = T.light;
      ctx.beginPath(); ctx.moveTo(R + 9, 0); ctx.lineTo(R + 2, -4); ctx.lineTo(R + 2, 4); ctx.closePath(); ctx.fill(); ctx.restore();
      // HP・弾数バー
      const bw = 38, bx = cx - bw / 2, by = p.y - 16, ratio = Math.max(0, Math.min(1, p.hp / 100));
      ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(bx - 1, by - 1, bw + 2, 7);
      ctx.fillStyle = ratio > .5 ? "#4dff9b" : ratio > .25 ? "#ffc53d" : "#ff4d5e"; ctx.fillRect(bx, by, bw * ratio, 5);
      if (p.maxAmmo <= 12) {
        const n = p.maxAmmo, gap = 2, pw = (bw - (n - 1) * gap) / n;
        for (let i = 0; i < n; i++) { ctx.fillStyle = i < p.ammo ? "#7df3ff" : "rgba(255,255,255,.2)"; ctx.fillRect(bx + i * (pw + gap), by + 8, pw, 3); }
      }
      if (p.charName === "ツインブラザーズ" && p.mode) {
        ctx.fillStyle = "#ffd23f"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillText(p.mode, bx + bw + 4, by + 6);
      }
    }

    function drawBullets() {
      bullets.forEach(b => {
        const T = TEAM[bulletOwner(b)], sp = Math.hypot(b.vx, b.vy);
        if (sp > .1) {
          const len = Math.min(36, sp * 4), ux = b.vx / sp, uy = b.vy / sp;
          const gr = ctx.createLinearGradient(b.x - ux * len, b.y - uy * len, b.x, b.y);
          gr.addColorStop(0, `rgba(${T.rgb},0)`); gr.addColorStop(1, `rgba(${T.rgb},.7)`);
          ctx.strokeStyle = gr; ctx.lineWidth = Math.max(2, b.r * 1.4); ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(b.x - ux * len, b.y - uy * len); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
        const gg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 3);
        gg.addColorStop(0, `rgba(${T.rgb},.55)`); gg.addColorStop(1, `rgba(${T.rgb},0)`);
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 3, 0, TAU); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(1.5, b.r * .75), 0, TAU); ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = T.main; ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(2, b.r), 0, TAU); ctx.stroke();
      });
      ctx.lineCap = "butt";
    }

    function drawExplosions() {
      explosions.forEach(e => {
        const p = 1 - e.life / 15, a = Math.max(0, 1 - p);
        const gr = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
        gr.addColorStop(0, `rgba(255,255,220,${(.85 * a).toFixed(2)})`); gr.addColorStop(.5, `rgba(255,150,50,${(.55 * a).toFixed(2)})`); gr.addColorStop(1, "rgba(255,60,20,0)");
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.fill();
        ctx.strokeStyle = `rgba(255,200,120,${a.toFixed(2)})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (.55 + .45 * p), 0, TAU); ctx.stroke();
        ctx.lineWidth = 2;
        for (let i = 0; i < 10; i++) {
          const ang = i * TAU / 10 + .3, r1 = e.r * (.3 + .7 * p), r2 = r1 + e.r * .25;
          ctx.beginPath(); ctx.moveTo(e.x + Math.cos(ang) * r1, e.y + Math.sin(ang) * r1); ctx.lineTo(e.x + Math.cos(ang) * r2, e.y + Math.sin(ang) * r2); ctx.stroke();
        }
      });
    }

    function draw() {
      fxSync();
      const W = canvas.width, H = canvas.height, th = MAP_THEME[selectedMap] || MAP_THEME["草原"];
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
      ctx.save();
      if (fx.shake > .3) { ctx.translate((Math.random() - .5) * fx.shake, (Math.random() - .5) * fx.shake); fx.shake *= .85; } else fx.shake = 0;
      ctx.drawImage(getBg(selectedMap), 0, 0);
      drawPads(ctx, pads, Date.now()); drawWarps(ctx, warps, performance.now() / 1000);
      obstacles.forEach(o => drawObstacle(ctx, o, th));
      drawZone();
      turrets.forEach(drawTurret);
      drawPlayer(player1); drawPlayer(player2);
      drawBullets(); drawExplosions();
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.font = "bold 15px sans-serif"; ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.8)";
      for (let i = fx.floaters.length - 1; i >= 0; i--) {
        const f = fx.floaters[i]; f.t++; f.y -= .6;
        if (f.t > 45) { fx.floaters.splice(i, 1); continue; }
        ctx.globalAlpha = 1 - f.t / 45; ctx.fillStyle = f.c; ctx.strokeText(f.txt, f.x, f.y); ctx.fillText(f.txt, f.x, f.y);
      }
      ctx.globalAlpha = 1;
      const el = Date.now() - gameStartTime;
      if (el >= 0 && el < 1300) {
        const k = el / 1300, sc = 1 + (1 - k) * .5;
        ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(sc, sc); ctx.globalAlpha = Math.min(1, (1 - k) * 2);
        ctx.font = "italic 900 72px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineWidth = 6; ctx.strokeStyle = "#000";
        ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 24; ctx.strokeText("FIGHT!", 0, 0); ctx.fillStyle = "#fff"; ctx.fillText("FIGHT!", 0, 0);
        ctx.restore();
      }
      ctx.restore();
      updateHud();
    }

    /* ---------- HUD ---------- */
    const hudState = { p1: null, p2: null, mx: [-1, -1] };
    function hudSetPlayer(i, p) {
      $("hudName" + i).textContent = p.charName;
      const img = characterImages[p.charName];
      $("hudImg" + i).innerHTML = img ? `<img src="${img}" alt="" onerror="this.outerHTML='${escapeHtml(p.charName.charAt(0))}'">` : escapeHtml(p.charName.charAt(0));
      $("hudTrail" + i).style.width = "100%";
    }
    function skillKey(i) {
      if (typeof onl !== "undefined" && onl.running) return (onl.isHost ? i === 1 : i === 2) ? "G" : "";
      return i === 1 ? "G" : "L";
    }
    function updateHud() {
      const now = Date.now();
      if (hudState.p1 !== player1 || hudState.p2 !== player2) {
        hudState.p1 = player1; hudState.p2 = player2; hudState.mx = [-1, -1];
        hudSetPlayer(1, player1); hudSetPlayer(2, player2);
        const online = typeof onl !== "undefined" && onl.running;
        $("controlHelp").textContent = online
          ? "移動：WASD / 矢印キー　攻撃：F　スキル：G"
          : "1P　移動 WASD ・ 攻撃 F ・ スキル G　　|　　2P　移動 ↑↓←→ ・ 攻撃 K ・ スキル L";
        const label = (MAP_DEFS[selectedMap] ? selectedMap + " / " + MAP_DEFS[selectedMap].tag : selectedMap);
        $("gameInfo").textContent = label;
      }
      [[player1, 1], [player2, 2]].forEach(([p, i]) => {
        const ratio = Math.max(0, Math.min(1, p.hp / 100)), pct = (ratio * 100).toFixed(1) + "%";
        $("hudHp" + i).style.width = pct; $("hudTrail" + i).style.width = pct;
        $("hudHpTxt" + i).textContent = Math.max(0, Math.ceil(p.hp));
        const box = $("hudHpBox" + i); box.classList.toggle("mid", ratio <= .5 && ratio > .25); box.classList.toggle("low", ratio <= .25);
        const pips = $("hudAmmo" + i);
        if (hudState.mx[i - 1] !== p.maxAmmo) {
          hudState.mx[i - 1] = p.maxAmmo;
          if (p.maxAmmo >= 100) { pips.className = "pips inf"; pips.textContent = "∞"; }
          else { pips.className = "pips"; pips.innerHTML = "<i></i>".repeat(p.maxAmmo); }
        }
        if (p.maxAmmo < 100) for (let k = 0; k < pips.children.length; k++) pips.children[k].classList.toggle("on", k < p.ammo);
        const heal = p.charName === "聖なる使者", ready = isSkillReady(p, now), key = skillKey(i);
        const sk = heal ? p.skillCharge / 30 : (ready ? 1 : (now - p.skillLastUsed) / p.skillCooldown);
        $("hudSk" + i).style.width = (Math.max(0, Math.min(1, sk)) * 100).toFixed(1) + "%";
        $("hudSkBox" + i).classList.toggle("ready", ready);
        $("hudSkTxt" + i).textContent = heal ? (ready ? "HEAL" : "CHARGE " + Math.min(30, Math.floor(p.skillCharge)) + "/30") + (ready && key ? " [" + key + "]" : "")
                                              : (ready ? "READY" + (key ? " [" + key + "]" : "") : "SKILL");
      });
      const el = Math.max(0, Math.floor((now - gameStartTime) / 1000));
      $("hudTimer").textContent = Math.floor(el / 60) + ":" + String(el % 60).padStart(2, "0");
      const z = $("hudZone");
      if (el < 25) { z.textContent = "ZONE まで " + (25 - el) + "s"; z.classList.remove("hot"); }
      else { z.textContent = "ZONE 縮小中"; z.classList.add("hot"); }
    }

    /* ---------- YOU マーカー（オンライン） ---------- */
    function drawYouMarker() {
      const me = onl.isHost ? player1 : player2;
      if (!me || !ctx) return;
      const T = onl.isHost ? TEAM[1] : TEAM[2], cx = me.x + me.w / 2, y = me.y - 30 + Math.sin(Date.now() / 200) * 2;
      ctx.save(); ctx.fillStyle = T.main; ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, y + 6); ctx.lineTo(cx - 6, y - 4); ctx.lineTo(cx + 6, y - 4); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 3; ctx.strokeText("YOU", cx, y - 8); ctx.fillStyle = "#fff"; ctx.fillText("YOU", cx, y - 8);
      ctx.restore();
    }

    /* ============================================================
       キャラ選択
       ============================================================ */
    let csActive = 1, _allStats = null;
    function relRows(name) {
      if (!_allStats) _allStats = CHAR_NAMES.map(charStats);
      const all = _allStats, st = charStats(name);
      const maxSpeed = Math.max(...all.map(s => s.speed)), maxPower = Math.max(...all.map(s => s.power));
      const maxAmmo = Math.max(...all.map(s => s.ammo).filter(a => a < 100));
      const maxRate = Math.max(...all.map(s => 1 / s.reload));
      const maxSkill = Math.max(...all.filter(s => isFinite(s.skillCt)).map(s => 1 / s.skillCt));
      const pct = v => Math.max(4, Math.min(100, Math.round(v * 100)));
      return [
        ["速度", pct(st.speed / maxSpeed), st.speed.toFixed(1)],
        ["攻撃", pct(st.power / maxPower), st.shots > 1 ? `${st.dmg}×${st.shots}` : `${st.dmg}`],
        ["装弾", st.ammo >= 100 ? 100 : pct(st.ammo / maxAmmo), st.ammo >= 100 ? "∞" : `${st.ammo}発`],
        ["装填", pct((1 / st.reload) / maxRate), `${st.reload.toFixed(1)}秒`],
        ["技", isFinite(st.skillCt) ? pct((1 / st.skillCt) / maxSkill) : 4, isFinite(st.skillCt) ? `${st.skillCt}秒` : "溜め式"]
      ];
    }
    function renderSidePanel(id, idx, name) {
      $(id).innerHTML = `<div class="who">${idx}P ・ ${idx === 1 ? "BLUE" : "RED"}</div>
        <div class="cs-portrait">${imgOrPlaceholder(name)}</div>
        <div class="cs-name">${escapeHtml(name)}</div>
        <div class="cs-tag">${escapeHtml(CHAR_TAGS[name] || "")}</div>
        ${relRows(name).map(r => `<div class="stat"><span>${r[0]}</span><div class="bar"><i style="width:${r[1]}%"></i></div><span class="val">${r[2]}</span></div>`).join("")}`;
    }
    function csSetActive(i) { csActive = i; renderCharSelect(); }
    function csPick(name) { $("player" + csActive + "Select").value = name; csActive = csActive === 1 ? 2 : 1; renderCharSelect(); }
    function renderCharSelect() {
      const grid = $("csGrid");
      if (!grid.dataset.built) {
        grid.innerHTML = CHAR_NAMES.map(n => `<button class="cs-card" data-name="${escapeHtml(n)}">${imgOrPlaceholder(n)}<span>${escapeHtml(n)}</span><span class="cs-badges"></span></button>`).join("");
        grid.querySelectorAll(".cs-card").forEach(b => b.addEventListener("click", () => csPick(b.dataset.name)));
        grid.dataset.built = "1";
      }
      const sel = [$("player1Select").value, $("player2Select").value];
      grid.querySelectorAll(".cs-card").forEach(b => {
        const n = b.dataset.name;
        b.classList.toggle("sel1", n === sel[0]); b.classList.toggle("sel2", n === sel[1]);
        b.querySelector(".cs-badges").innerHTML = (n === sel[0] ? '<i class="b1">1P</i>' : "") + (n === sel[1] ? '<i class="b2">2P</i>' : "");
      });
      $("csTab1").className = "cs-tab" + (csActive === 1 ? " on1" : ""); $("csTab2").className = "cs-tab" + (csActive === 2 ? " on2" : "");
      renderSidePanel("csP1", 1, sel[0]); renderSidePanel("csP2", 2, sel[1]);
    }

    /* ============================================================
       マップ選択
       ============================================================ */
    let msBuilt = false;
    function gmChips(name) {
      const g = mapGimmicks(name);
      return '<span class="gm-row">' + (g.length
        ? g.map(k => `<span class="gm-chip ${k}">${GM_INFO[k].label}</span>`).join("")
        : '<span class="gm-chip none">ギミックなし</span>') + "</span>";
    }
    function gmDetailHtml(name) {
      const g = mapGimmicks(name);
      if (!g.length) return '<div class="gm-line"><span class="gm-chip none">ギミックなし</span><span>シンプルな撃ち合い。腕前勝負のマップ</span></div>';
      return g.map(k => `<div class="gm-line"><span class="gm-chip ${k}">${GM_INFO[k].label}</span><span>${GM_INFO[k].text}</span></div>`).join("");
    }
    function renderMapSelect() {
      $("msVs").textContent = $("player1Select").value + "  VS  " + $("player2Select").value;
      const list = $("msList");
      if (!msBuilt) {
        list.innerHTML = MAP_NAMES.map(n => `<button class="ms-card" data-name="${n}"><canvas width="240" height="120"></canvas><span class="txt"><b>${n}</b><small>${MAP_DEFS[n].tag}</small>${gmChips(n)}</span></button>`).join("");
        list.querySelectorAll(".ms-card").forEach(b => {
          drawMapPreview(b.querySelector("canvas"), b.dataset.name);
          b.addEventListener("click", () => { $("mapSelectDropdown").value = b.dataset.name; renderMapSelect(); });
        });
        msBuilt = true;
      }
      const cur = $("mapSelectDropdown").value;
      list.querySelectorAll(".ms-card").forEach(b => b.classList.toggle("on", b.dataset.name === cur));
      drawMapPreview($("msBig"), cur);
      $("msName").textContent = cur; $("msTag").textContent = MAP_DEFS[cur].tag; $("msDesc").textContent = MAP_DEFS[cur].desc;
      $("msGm").innerHTML = gmDetailHtml(cur);
    }

    /* ============================================================
       オンライン ロビー（キャラ選択はオフラインと同じカード式）
       ============================================================ */
    let lobbyBuilt = false;
    function buildLobby() {
      if (lobbyBuilt) return;
      lobbyBuilt = true;
      const grid = $("lobbyGrid");
      grid.innerHTML = CHAR_NAMES.map(n => `<button class="cs-card" data-name="${escapeHtml(n)}">${imgOrPlaceholder(n)}<span>${escapeHtml(n)}</span><span class="cs-badges"></span></button>`).join("");
      grid.querySelectorAll(".cs-card").forEach(b => b.addEventListener("click", () => lobbyPickChar(b.dataset.name)));
      const maps = $("lobbyMaps");
      maps.innerHTML = MAP_NAMES.map(n => `<button class="lm-card" data-name="${n}"><canvas width="160" height="80"></canvas><span>${n}</span></button>`).join("");
      maps.querySelectorAll(".lm-card").forEach(b => {
        drawMapPreview(b.querySelector("canvas"), b.dataset.name);
        b.addEventListener("click", () => lobbyPickMap(b.dataset.name));
      });
    }
    function lobbyPickChar(n) { onl.myChar = n; sendMsg({ t: "char", v: n }); updateLobby(); }
    function lobbyPickMap(n) { if (!onl.isHost) return; onl.map = n; sendMsg({ t: "map", v: n }); updateLobby(); }

    function enterLobby() {
      buildLobby();
      setLobbyStatus("");
      showScreen("onlineLobby");
      updateLobby();
    }

    function renderLobbySide(id, idx, name, isMe) {
      const el = $(id);
      const tag = idx + "P ・ " + (idx === 1 ? "BLUE" : "RED") + (isMe ? "（あなた）" : "");
      if (!name) {
        const wait = (onl.conn && onl.conn.open) ? "選択中…" : "対戦相手を待っています…";
        el.innerHTML = `<div class="who">${tag}</div><div class="cs-portrait"><div class="cx-ph">?</div></div><div class="cs-name" style="font-size:15px">${wait}</div>`;
        return;
      }
      renderSidePanel(id, idx, name);
      el.querySelector(".who").textContent = tag;
    }

    function updateLobby() {
      const host = onl.isHost;
      $("lobbyCode").textContent = onl.code || "----";
      const p1 = host ? onl.myChar : onl.oppChar;
      const p2 = host ? onl.oppChar : onl.myChar;
      renderLobbySide("lobbyP1", 1, p1, host);
      renderLobbySide("lobbyP2", 2, p2, !host);
      $("lobbyGrid").querySelectorAll(".cs-card").forEach(b => {
        const n = b.dataset.name;
        b.classList.toggle("sel1", n === p1); b.classList.toggle("sel2", n === p2);
        b.querySelector(".cs-badges").innerHTML = (n === p1 ? '<i class="b1">1P</i>' : "") + (n === p2 ? '<i class="b2">2P</i>' : "");
      });
      $("lobbyWho").textContent = (host ? "あなたは 1P（青）" : "あなたは 2P（赤）") + "　キャラを選んでください";

      const maps = $("lobbyMaps");
      maps.classList.toggle("lock", !host);
      maps.querySelectorAll(".lm-card").forEach(b => b.classList.toggle("on", b.dataset.name === onl.map));
      const d = MAP_DEFS[onl.map] || MAP_DEFS[MAP_NAMES[0]];
      $("lobbyMapInfo").innerHTML = `<b>${escapeHtml(onl.map)}</b>｜${escapeHtml(d.tag)}` + (host ? "" : ' <span class="dim">（マップはホストが選びます）</span>') + gmDetailHtml(onl.map);

      const readyBtn = $("lobbyReadyBtn"), startBtn = $("lobbyStartBtn");
      readyBtn.classList.toggle("hidden", host);
      startBtn.classList.toggle("hidden", !host);
      readyBtn.textContent = onl.guestReady ? "準備解除" : "準備OK";
      const connected = !!(onl.conn && onl.conn.open);
      startBtn.disabled = !(connected && onl.guestReady && onl.oppChar);
      if (host && connected) {
        setLobbyStatus(onl.guestReady ? "相手の準備ができました。ゲーム開始できます！" : "相手の準備を待っています…");
      } else if (host) {
        setLobbyStatus("対戦相手を待っています…");
      } else {
        setLobbyStatus(onl.guestReady ? "ホストの開始を待っています…" : "キャラを選んで「準備OK」を押してください。");
      }
    }

    const _goCS = goToCharacterSelect; goToCharacterSelect = function () { _goCS(); renderCharSelect(); };
    const _goMS = goToMapSelect;       goToMapSelect = function () { _goMS(); renderMapSelect(); };

    /* ---------- 初期化（非表示の select に値を入れる） ---------- */
    (function () {
      CHAR_NAMES.forEach(n => { $("player1Select").add(new Option(n, n)); $("player2Select").add(new Option(n, n)); });
      MAP_NAMES.forEach(n => $("mapSelectDropdown").add(new Option(n, n)));
      $("player1Select").value = CHAR_NAMES[0]; $("player2Select").value = CHAR_NAMES[1];
    })();
  </script>

  <script>
    /* ============================================================
       ver17：プレイ方法の選択（PC / モバイル）とタッチ操作
       ※ ゲーム本体は変更せず、キー入力と同じイベントを発行して操作します
       ============================================================ */
    let playMode = "pc";
    function tkey(type, key) { document.dispatchEvent(new KeyboardEvent(type, { key: key, bubbles: true })); }

    function makeJoy(el, keyMap) {
      const knob = el.querySelector(".knob"), st = { u: 0, d: 0, l: 0, r: 0 };
      let id = null;
      const set = (k, v) => { if (st[k] !== v) { st[k] = v; tkey(v ? "keydown" : "keyup", keyMap[k]); } };
      const reset = () => { id = null; knob.style.transform = ""; ["u", "d", "l", "r"].forEach(k => set(k, 0)); };
      const upd = e => {
        const r = el.getBoundingClientRect(), R = r.width / 2;
        const dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R), m = Math.hypot(dx, dy) || 1, c = Math.min(m, R);
        knob.style.transform = `translate(${dx / m * c * .6}px, ${dy / m * c * .6}px)`;
        const on = m > R * .3, a = m * .38;
        set("l", on && dx < -a ? 1 : 0); set("r", on && dx > a ? 1 : 0);
        set("u", on && dy < -a ? 1 : 0); set("d", on && dy > a ? 1 : 0);
      };
      el.addEventListener("pointerdown", e => { if (id !== null) return; id = e.pointerId; try { el.setPointerCapture(id); } catch (x) {} upd(e); e.preventDefault(); });
      el.addEventListener("pointermove", e => { if (e.pointerId === id) upd(e); });
      const end = e => { if (e.pointerId === id) reset(); };
      el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
      return { release() { if (id !== null) reset(); } };
    }
    function makeBtn(el) {
      const key = el.dataset.key; let id = null;
      el.addEventListener("pointerdown", e => { if (id !== null) return; id = e.pointerId; try { el.setPointerCapture(id); } catch (x) {} el.classList.add("down"); tkey("keydown", key); e.preventDefault(); });
      const end = e => { if (e.pointerId !== id) return; id = null; el.classList.remove("down"); tkey("keyup", key); };
      el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
    }

    const touchUI = document.createElement("div");
    touchUI.id = "touchUI";
    touchUI.innerHTML = `
      <div class="tp tp1"><div class="joy" id="joy1"><div class="knob"></div></div>
        <div class="tbtns"><button class="tbtn atk" data-key="f">攻撃</button><button class="tbtn skl" data-key="g">スキル</button></div></div>
      <div class="tp tp2"><div class="joy" id="joy2"><div class="knob"></div></div>
        <div class="tbtns"><button class="tbtn atk" data-key="k">攻撃</button><button class="tbtn skl" data-key="l">スキル</button></div></div>`;
    document.body.appendChild(touchUI);
    const rot = document.createElement("div");
    rot.id = "rotateMsg"; rot.innerHTML = "<b>📱↻</b><div>横向きにしてください</div>";
    document.body.appendChild(rot);
    const joys = [
      makeJoy(document.getElementById("joy1"), { u: "w", d: "s", l: "a", r: "d" }),
      makeJoy(document.getElementById("joy2"), { u: "ArrowUp", d: "ArrowDown", l: "ArrowLeft", r: "ArrowRight" })
    ];
    touchUI.querySelectorAll(".tbtn").forEach(makeBtn);

    async function lockLandscape() {
      try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (e) {}
      try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch (e) {}
    }
    function unlockFullscreen() {
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
      try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) {}
    }
    /* 画面の高さに合わせて、メニューを1画面に収めるための変数とクラスを更新 */
    function updateViewport() {
      const h = window.innerHeight, root = document.documentElement;
      root.style.setProperty("--app-h", h + "px");
      root.style.setProperty("--u", (h / 100) + "px");
      document.body.classList.toggle("compact", playMode === "mobile" || h < 520);
    }
    function setPlayMode(m, byUser) {
      playMode = m === "mobile" ? "mobile" : "pc";
      document.body.classList.toggle("mobile", playMode === "mobile");
      document.getElementById("modePC").classList.toggle("on", playMode === "pc");
      document.getElementById("modeMobile").classList.toggle("on", playMode === "mobile");
      try { localStorage.setItem("playMode", playMode); } catch (e) {}
      if (playMode === "mobile") { if (byUser) lockLandscape(); }
      else { joys.forEach(j => j.release()); unlockFullscreen(); }
      updateViewport();
    }
    window.addEventListener("resize", updateViewport);
    window.addEventListener("orientationchange", updateViewport);
    document.addEventListener("fullscreenchange", updateViewport);

    /* メニュー（ホーム画面）で何かを押したら全画面＋横向き固定。ホームに戻ったら解除 */
    document.getElementById("homeScreen").addEventListener("click", e => {
      if (playMode === "mobile" && e.target.closest("button")) lockLandscape();
    });
    let wasHome = true;
    setInterval(() => {
      const ig = !document.getElementById("gameScreen").classList.contains("hidden");
      document.body.classList.toggle("ingame", ig);
      touchUI.classList.toggle("online", !!(typeof onl !== "undefined" && onl.running));
      if (!ig || playMode !== "mobile") joys.forEach(j => j.release());
      const home = !document.getElementById("homeScreen").classList.contains("hidden");
      if (home && !wasHome && playMode === "mobile") unlockFullscreen();
      wasHome = home;
    }, 150);

    (function () {
      let saved = "";
      try { saved = localStorage.getItem("playMode") || ""; } catch (e) {}
      if (saved !== "pc" && saved !== "mobile") saved = (window.matchMedia && matchMedia("(pointer: coarse)").matches) ? "mobile" : "pc";
      setPlayMode(saved, false);
    })();
  </script>
</body>
