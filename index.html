    function renderBody() {
      const bd = $("fdBody"); if (!bd) return;
      if (tab === "list") {
        const host = inRoomAsHost(), arr = friends.map(f => ({ ...f, name: (live[f.uid] && live[f.uid].name) || f.name, on: isOn(f.uid), seen: (live[f.uid] && live[f.uid].lastSeen) || 0 }));
        const row = f => '<div class="fdRow ' + (f.on ? "on" : "off") + '"><span class="dot"></span><span class="nm">' + esc(f.name) + '<span class="sub">' + (f.on ? "オンライン" : f.seen ? "最終 " + ago(f.seen) : "オフライン") + "</span></span>" +
          (f.on && host ? '<button class="sm" data-act="inv" data-id="' + esc(f.uid) + '">招待</button>' : "") + '<button class="sm" data-act="del" data-id="' + esc(f.uid) + '" title="削除">🗑</button></div>';
        const on = arr.filter(f => f.on).sort((a, b) => a.name.localeCompare(b.name)), off = arr.filter(f => !f.on).sort((a, b) => b.seen - a.seen);
        bd.innerHTML = !arr.length ? '<div class="fdEmpty">まだフレンドがいません。「追加」タブからフレンドコードで申請しましょう。</div>' :
          "<h4>オンライン — " + on.length + "</h4>" + (on.length ? on.map(row).join("") : '<div class="fdEmpty">オンラインのフレンドはいません。</div>') +
          "<h4>オフライン — " + off.length + "</h4>" + off.map(row).join("") +
          (!host ? '<div class="fdEmpty" style="margin-top:8px">招待するには、オンライン対戦で「ルームを作成」してロビーを開いてください。</div>' : "");
        bd.insertAdjacentHTML("afterbegin", lobbyHtml());
      } else if (tab === "req") {
        bd.innerHTML = reqs.length ? reqs.map(r => '<div class="fdRow"><span class="nm">' + esc(r.fromName || "?") + '<span class="sub">フレンド申請</span></span><button class="sm" data-act="accept" data-id="' + esc(r.id) + '">承認</button><button class="sm" data-act="decline" data-id="' + esc(r.id) + '">拒否</button></div>').join("") : '<div class="fdEmpty">届いている申請はありません。</div>';
      } else if (tab === "add" && !bd.dataset.built) {
        bd.dataset.built = "1";

          '<div class="fdEmpty" style="text-align:center">このコードを友達に教えて、申請してもらいましょう。</div>' +
          '<h4>フレンドを追加</h4><input type="text" id="fdAddCode" maxlength="6" placeholder="相手のコード"><div style="text-align:center;margin-top:8px"><button data-act="addFriend">申請を送る</button></div>';

    /* ---------- 操作 ---------- */
    async function act(a, el) {
      try {
        if (a === "close") return closeModal();
        if (a === "tab") { tab = el.dataset.id; return renderDrawer(false); }
        if (a === "drawerClose") return closeDrawer();
        if (a === "settings") { openModal(); return; }
        if (a === "friendsOpen") { closeModal(); return openDrawer(); }
        if (a === "google") {
          const pr = new GoogleAuthProvider();
          try { await signInWithPopup(auth, pr); }
          catch (e) {
            if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") await signInWithRedirect(auth, pr);
            else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") setMsg(errText(e));
          }
          return;
        }
        if (a === "login") { await signInWithEmailAndPassword(auth, $("accEmail").value.trim(), $("accPass").value); return; }
        if (a === "signup") {
          const c = await createUserWithEmailAndPassword(auth, $("accEmail").value.trim(), $("accPass").value);
          const dn = ($("accDisp").value || "").trim().slice(0, 16);
          if (dn) await updateProfile(c.user, { displayName: dn });
          await sendEmailVerification(c.user);
          return;
        }
        if (a === "reset") {
          const m = $("accEmail").value.trim(); if (!m) return setMsg("メールアドレスを入力してください。");
          await sendPasswordResetEmail(auth, m); return setMsg("パスワード再設定のメールを送りました。");
        }
        if (a === "resend") { await sendEmailVerification(auth.currentUser); return setMsg("確認メールを再送しました。"); }
        if (a === "verified") {
          await auth.currentUser.reload(); await auth.currentUser.getIdToken(true);
          if (auth.currentUser.emailVerified) return handleUser(auth.currentUser);
          return setMsg("まだ確認できていません。メールのリンクを開いてください。");
        }
        if (a === "logout") { try { if (state === "user") await updateDoc(doc(db, "users", user.uid), { lastSeen: 0 }); } catch (e) {} closeModal(); await signOut(auth); return; }
        if (a === "copyCode") { try { await navigator.clipboard.writeText(profile.code); setMsg("コピーしました。"); } catch (e) { setMsg("コード：" + profile.code); } return; }
        if (a === "saveName") {
          const n = ($("accEditName").value || "").trim().slice(0, 16); if (!n) return setMsg("名前を入力してください。");
          await updateDoc(doc(db, "users", user.uid), { name: n });
          const b = writeBatch(db); friends.forEach(f => b.update(doc(db, "users", f.uid, "friends", user.uid), { name: n }));
          if (friends.length) await b.commit().catch(() => {});
          profile.name = n; setChip(); build(); renderDrawer(false); return setMsg("名前を変更しました。");
        }
        if (a === "addFriend") {
          const code = ($("fdAddCode").value || "").toUpperCase().trim(); if (code.length !== 6) return setMsg("6文字のフレンドコードを入力してください。");
          const c = await getDoc(doc(db, "codes", code)); if (!c.exists()) return setMsg("そのコードは見つかりません。");
          const to = c.data().uid; if (to === user.uid) return setMsg("自分自身には申請できません。");
          if (friends.some(f => f.uid === to)) return setMsg("すでにフレンドです。");
          await setDoc(doc(db, "friendRequests", user.uid + "_" + to), { from: user.uid, to, fromName: myName(), at: Date.now() });
          $("fdAddCode").value = ""; return setMsg("フレンド申請を送りました。");
        }
        if (a === "lobbyAdd") {
          const to = el.dataset.id; if (!to || to === user.uid) return;
          if (friends.some(f => f.uid === to)) return setMsg("すでにフレンドです。");
          if (reqs.some(r => r.from === to)) return setMsg("相手から申請が届いています。「申請」タブで承認できます。");
          await setDoc(doc(db, "friendRequests", user.uid + "_" + to), { from: user.uid, to, fromName: myName(), at: Date.now() });
          asked.add(to); renderDrawer(true); return setMsg((el.dataset.nm || "相手") + " さんにフレンド申請を送りました。");
        }
        if (a === "accept") {
          const r = reqs.find(x => x.id === el.dataset.id); if (!r) return;
          const b = writeBatch(db);
          b.set(doc(db, "users", user.uid, "friends", r.from), { name: r.fromName || "?" });
          b.set(doc(db, "users", r.from, "friends", user.uid), { name: myName() });
          b.delete(doc(db, "friendRequests", r.id));
          await b.commit(); return setMsg((r.fromName || "") + " さんとフレンドになりました。");
        }
        if (a === "decline") { await deleteDoc(doc(db, "friendRequests", el.dataset.id)); return; }
        if (a === "del") {
          const f = friends.find(x => x.uid === el.dataset.id); if (!f || !confirm(f.name + " さんをフレンドから削除しますか？")) return;
          const b = writeBatch(db); b.delete(doc(db, "users", user.uid, "friends", f.uid)); b.delete(doc(db, "users", f.uid, "friends", user.uid)); await b.commit(); return;
        }
        if (a === "inv") {
          if (!inRoomAsHost()) return setMsg("先にルームを作成してください。");
          const id = user.uid + "_" + el.dataset.id;
          await setDoc(doc(db, "invites", id), { from: user.uid, to: el.dataset.id, fromName: myName(), code: onl.code, mode: "1v1", slots: 2, at: Date.now() });
          sent.add(id); return setMsg("招待を送りました。");
        }
      } catch (e) { console.warn(e); setMsg(errText(e)); }
    }
    $("accPanel").addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b) act(b.dataset.act, b); });
    $("fdDrawer").addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b) act(b.dataset.act, b); });
    setInterval(() => { // 対戦中は非表示にして、パネルも閉じる
      const gs = document.getElementById("gameScreen"), playing = gs && !gs.classList.contains("hidden");
      $("fdDock").style.display = playing ? "none" : "flex"; if (playing && drawerOpen) closeDrawer();
    }, 300);
    $("accModal").addEventListener("click", e => { if (e.target.id === "accModal") closeModal(); });

    window.Account = {
      open(t) { if (t === "friends" && state === "user") { drawerOpen ? closeDrawer() : openDrawer(); } else openModal(); },
      name: myName,
      uid: () => (state === "user" && user) ? user.uid : "",
      loggedIn: () => state === "user",
      dropInvites() { sent.forEach(id => deleteDoc(doc(db, "invites", id)).catch(() => {})); sent.clear(); }
    };
    setChip(); build();
